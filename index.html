<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SM OS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#f5f1ea,#f3f4f6);color:#1f2937}.shell{min-height:100vh;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;box-shadow:0 18px 45px #11182714}.btn{border:0;border-radius:14px;padding:12px 18px;background:#111827;color:#fff;font-weight:800;cursor:pointer}.btn2{border:1px solid #d1d5db;border-radius:14px;padding:12px 18px;background:#fff;color:#111827;font-weight:800;cursor:pointer}.danger{border:1px solid #fecaca;border-radius:14px;padding:10px 14px;background:#fff5f5;color:#991b1b;font-weight:800;cursor:pointer}.input{width:100%;border:1px solid #d1d5db;border-radius:14px;padding:13px 14px;font-size:15px;background:#fff}.label{font-size:13px;font-weight:800;color:#374151;display:block;margin-bottom:7px}.small{font-size:12px;color:#6b7280;font-weight:800}.grid{display:grid;gap:16px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.layout{display:grid;grid-template-columns:245px 1fr;gap:18px}.nav{display:grid;gap:10px}.nav button{border:1px solid #e5e7eb;background:#fff;border-radius:14px;padding:12px;text-align:left;font-weight:800;cursor:pointer}.nav button.active{background:#111827;color:#fff}.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:8px 12px;min-width:76px;font-size:12px;font-weight:900}.green{background:#e8f5e9;color:#2e7d32}.yellow{background:#fff8e1;color:#b7791f}.red{background:#ffebee;color:#c62828}.gray{background:#f3f4f6;color:#374151}.table{width:100%;border-collapse:separate;border-spacing:0 10px}.table th{text-align:left;color:#6b7280;font-size:12px;padding:0 10px}.table td{background:#fff;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;padding:14px 10px}.table td:first-child{border-left:1px solid #e5e7eb;border-radius:14px 0 0 14px}.table td:last-child{border-right:1px solid #e5e7eb;border-radius:0 14px 14px 0}.modalBg{position:fixed;inset:0;background:#11182761;display:grid;place-items:center;padding:24px;z-index:50}.modal{width:100%;max-width:780px;max-height:90vh;overflow:auto;background:#fff;border-radius:24px;border:1px solid #e5e7eb;box-shadow:0 25px 70px #11182733;padding:28px}.kanban{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:14px;overflow:auto}.kanbanCol{background:#f9fafb;border:1px solid #e5e7eb;border-radius:18px;padding:14px;min-height:330px}@media(max-width:1000px){.layout,.grid2,.grid4,.kanban{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>
const URL="https://yrgbmzxlvbxzegzvwadf.supabase.co";const KEY="sb_publishable_h_1R-zkaFZqENNSnlrTECA_QDJUF-Vq";const sb=supabase.createClient(URL,KEY);let S={me:null,view:"dashboard",selectedClient:"",users:[],clients:[],projects:[],tasks:[],subtasks:[],comments:[],files:[]};const A=document.getElementById("app");const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const today=()=>new Date().toISOString().slice(0,10);function days(d){if(!d)return 999;let a=new Date(),b=new Date(d+"T00:00:00");a.setHours(0,0,0,0);return Math.ceil((b-a)/86400000)}function light(t){if(t.status==="terminada")return"green";let d=days(t.due_date);if(d<0)return"gray";if(d<=1)return"red";if(d<=3)return"yellow";return"green"}function ltxt(c){return c==="green"?"En tiempo":c==="yellow"?"Próxima":c==="red"?"Crítica":"Vencida"}function cn(id){return S.clients.find(x=>x.id===id)?.name||"Sin cliente"}function pn(id){return S.projects.find(x=>x.id===id)?.name||"Sin proyecto"}function un(id){return S.users.find(x=>x.id===id)?.name||"Sin responsable"}function vt(){return S.selectedClient?S.tasks.filter(t=>t.client_id===S.selectedClient):S.tasks}async function load(){let r=await Promise.all([sb.from("users").select("*").order("created_at"),sb.from("clients").select("*").order("created_at"),sb.from("projects").select("*").order("created_at"),sb.from("tasks").select("*").order("created_at",{ascending:false}),sb.from("subtasks").select("*").order("created_at"),sb.from("comments").select("*").order("created_at",{ascending:false}),sb.from("files").select("*").order("created_at",{ascending:false})]);let e=r.find(x=>x.error);if(e)throw e.error;[S.users,S.clients,S.projects,S.tasks,S.subtasks,S.comments,S.files]=r.map(x=>x.data||[])}async function boot(){try{await load();loginScreen()}catch(e){A.innerHTML=`<main class=shell style="display:grid;place-items:center"><div class=card style="max-width:760px;padding:32px"><h1>SM OS</h1><p style="color:#c62828;font-weight:800">No conecta con Supabase o falta ejecutar schema.sql.</p><pre>${esc(e.message||e)}</pre></div></main>`}}function loginScreen(msg=""){A.innerHTML=`<main class=shell style="display:grid;place-items:center"><form class=card style="width:100%;max-width:460px;padding:34px" onsubmit="login(event)"><div class=small>SM SOLUCIONES</div><h1 style="font-size:58px;margin:8px 0 4px">SM OS</h1><p style="color:#6b7280;font-size:20px;margin-top:0">Sistema Operativo de Gestión Interna</p><label class=label>Usuario</label><input id=u class=input value=pako style="margin-bottom:16px"><label class=label>PIN</label><input id=p class=input value=1234 type=password style="margin-bottom:16px">${msg?`<div style="color:#c62828;font-weight:800;margin-bottom:14px">${esc(msg)}</div>`:""}<button class=btn style="width:100%">Entrar</button><p class=small>Demo inicial: pako / 1234</p></form></main>`}async function login(e){e.preventDefault();let {data,error}=await sb.from("users").select("*").eq("username",u.value.trim()).eq("pin",p.value.trim()).eq("active",true).maybeSingle();if(error||!data)return loginScreen("Usuario o PIN incorrecto.");S.me=data;await load();app()}function nav(v,l){return`<button class="${S.view===v?'active':''}" onclick="S.view='${v}';app()">${l}</button>`}function app(){A.innerHTML=`<main class=shell><header class=card style="padding:24px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div><div class=small>SM OS</div><h1 style="margin:4px 0 0">${S.selectedClient?esc(cn(S.selectedClient)):"Panel General"}</h1><p style="margin:6px 0 0;color:#6b7280">${esc(S.me.name)} · ${esc(S.me.role)}</p></div><div style="display:flex;gap:10px">${S.selectedClient?`<button class=btn2 onclick="S.selectedClient='';app()">Vista general</button>`:""}<button class=btn2 onclick="S.me=null;loginScreen()">Salir</button></div></header><section class=layout><aside class=card style="padding:18px;align-self:start"><div class=nav>${nav("dashboard","Dashboard")}${nav("clientes","Clientes")}${nav("proyectos","Proyectos")}${nav("tareas","Tareas")}${nav("kanban","Kanban")}${nav("calendario","Calendario")}${nav("reportes","Reportes")}${nav("usuarios","Usuarios")}</div></aside><section id=c></section></section></main>`;view()}function panel(t,a,fn,b){return`<div class=card style="padding:24px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px"><h2 style="margin:0">${t}</h2>${a?`<button class=btn onclick="${fn}">${a}</button>`:""}</div>${b}</div>`}function stat(l,v){return`<div class=card style="padding:20px"><div class=small>${l}</div><div style="font-size:28px;font-weight:900;margin-top:8px">${v}</div></div>`}function view(){if(S.view==="dashboard")dash();if(S.view==="clientes")clients();if(S.view==="usuarios")users();if(S.view==="proyectos")projects();if(S.view==="tareas")tasks();if(S.view==="kanban")kanban();if(S.view==="calendario")cal();if(S.view==="reportes")reports()}function dash(){c.innerHTML=`<div class=grid><div class="grid grid4">${stat("Clientes activos",S.clients.length)}${stat("Proyectos",S.projects.length)}${stat("Tareas abiertas",S.tasks.filter(t=>t.status!=="terminada").length)}${stat("Críticas/vencidas",S.tasks.filter(t=>["red","gray"].includes(light(t))).length)}</div><div class="grid grid2">${panel("Clientes","Nuevo cliente","mClient()",`<div class=grid>${S.clients.map(x=>`<button class=btn2 style="display:flex;justify-content:space-between" onclick="S.selectedClient='${x.id}';S.view='tareas';app()"><span>${esc(x.name)}</span><span>Ver</span></button>`).join("")}</div>`)}${panel("Tareas prioritarias","Nueva tarea","mTask()",taskCards(vt().slice(0,6)))}</div></div>`}function taskCards(list){if(!list.length)return`<div class=card style="padding:22px;box-shadow:none">Sin tareas.</div>`;return`<div class=grid>${list.map(t=>`<div class=card style="padding:16px;box-shadow:none"><div style="display:flex;justify-content:space-between;gap:12px"><div><div class=small>${esc(cn(t.client_id))} · ${esc(pn(t.project_id))}</div><h3 style="margin:6px 0">${esc(t.title)}</h3><p style="margin:0;color:#6b7280">${esc(un(t.owner_id))} · vence ${t.due_date||"sin fecha"} · ${esc(t.status)}</p></div><span class="badge ${light(t)}">${ltxt(light(t))}</span></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class=btn2 onclick="openT('${t.id}')">Abrir</button><button class=btn2 onclick="upT('${t.id}','en_proceso')">En proceso</button><button class=btn2 onclick="upT('${t.id}','en_revision')">Revisión</button><button class=btn2 onclick="upT('${t.id}','terminada')">Terminar</button><button class=danger onclick="del('tasks','${t.id}')">Borrar</button></div></div>`).join("")}</div>`}function clients(){let r=S.clients.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.description)}</td><td><button class=btn2 onclick="S.selectedClient='${x.id}';S.view='proyectos';app()">Abrir</button> <button class=danger onclick="del('clients','${x.id}')">Borrar</button></td></tr>`).join("");c.innerHTML=panel("Clientes","Nuevo cliente","mClient()",`<table class=table><thead><tr><th>Cliente</th><th>Descripción</th><th>Acciones</th></tr></thead><tbody>${r}</tbody></table>`)}function users(){let r=S.users.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td><button class=danger onclick="del('users','${x.id}')">Borrar</button></td></tr>`).join("");c.innerHTML=panel("Usuarios","Nuevo usuario","mUser()",`<table class=table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th></th></tr></thead><tbody>${r}</tbody></table>`)}function projects(){let l=S.selectedClient?S.projects.filter(p=>p.client_id===S.selectedClient):S.projects;let r=l.map(p=>`<tr><td><b>${esc(p.name)}</b><div class=small>${esc(p.description)}</div></td><td>${esc(cn(p.client_id))}</td><td>${esc(p.status)}</td><td>${p.start_date||"-"} → ${p.due_date||"-"}</td><td><button class=danger onclick="del('projects','${p.id}')">Borrar</button></td></tr>`).join("");c.innerHTML=panel("Proyectos","Nuevo proyecto","mProject()",`<table class=table><thead><tr><th>Proyecto</th><th>Cliente</th><th>Estatus</th><th>Fechas</th><th></th></tr></thead><tbody>${r}</tbody></table>`)}function tasks(){c.innerHTML=panel("Tareas","Nueva tarea","mTask()",taskCards(vt()))}function kanban(){let cols=[["pendiente","Pendiente"],["en_proceso","En proceso"],["en_revision","En revisión"],["terminada","Terminada"]];c.innerHTML=panel("Kanban","Nueva tarea","mTask()",`<div class=kanban>${cols.map(([k,l])=>`<div class=kanbanCol><h3>${l}</h3>${vt().filter(t=>t.status===k).map(t=>`<button class=card style="padding:14px;margin-bottom:10px;width:100%;text-align:left;cursor:pointer" onclick="openT('${t.id}')"><div class=small>${esc(cn(t.client_id))}</div><b>${esc(t.title)}</b><div class=small>${esc(un(t.owner_id))} · ${t.due_date||"-"}</div></button>`).join("")}</div>`).join("")}</div>`)}function cal(){let r=[...vt()].sort((a,b)=>(a.due_date||"").localeCompare(b.due_date||"")).map(t=>`<tr><td>${t.due_date||"Sin fecha"}</td><td><b>${esc(t.title)}</b></td><td>${esc(cn(t.client_id))}</td><td><span class="badge ${light(t)}">${ltxt(light(t))}</span></td></tr>`).join("");c.innerHTML=panel("Calendario","Nueva tarea","mTask()",`<table class=table><thead><tr><th>Fecha</th><th>Tarea</th><th>Cliente</th><th>Semáforo</th></tr></thead><tbody>${r}</tbody></table>`)}function reports(){let cr=S.clients.map(x=>{let ts=S.tasks.filter(t=>t.client_id===x.id);return`<tr><td><b>${esc(x.name)}</b></td><td>${ts.length}</td><td>${ts.filter(t=>t.status!=="terminada").length}</td><td>${ts.filter(t=>t.status==="terminada").length}</td></tr>`}).join("");let ur=S.users.map(x=>{let ts=S.tasks.filter(t=>t.owner_id===x.id);return`<tr><td><b>${esc(x.name)}</b></td><td>${ts.length}</td><td>${ts.filter(t=>["red","gray"].includes(light(t))).length}</td></tr>`}).join("");c.innerHTML=`<div class=grid><div class="grid grid4">${stat("Tareas abiertas",S.tasks.filter(t=>t.status!=="terminada").length)}${stat("Tareas terminadas",S.tasks.filter(t=>t.status==="terminada").length)}${stat("Críticas/vencidas",S.tasks.filter(t=>["red","gray"].includes(light(t))).length)}${stat("Usuarios",S.users.length)}</div>${panel("Reporte por cliente","","",`<table class=table><tbody>${cr}</tbody></table>`)}${panel("Reporte por responsable","","",`<table class=table><tbody>${ur}</tbody></table>`)}</div>`}function modal(t,b){document.body.insertAdjacentHTML("beforeend",`<div id=m class=modalBg><div class=modal><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h2 style="margin:0">${t}</h2><button class=btn2 onclick="closeM()">Cerrar</button></div>${b}</div></div>`)}function closeM(){document.getElementById("m")?.remove()}function inp(n,l,type="text",v=""){return`<div><label class=label>${l}</label><input class=input name=${n} type=${type} value="${esc(v)}"></div>`}function sel(n,l,o){return`<div><label class=label>${l}</label><select class=input name=${n}>${o.map(([v,x])=>`<option value="${v}">${esc(x)}</option>`).join("")}</select></div>`}function mClient(){modal("Nuevo cliente",`<form class=grid onsubmit="addClient(event)">${inp("name","Nombre")}${inp("description","Descripción")}<button class=btn>Guardar</button></form>`)}function mUser(){modal("Nuevo usuario",`<form class=grid onsubmit="addUser(event)">${inp("name","Nombre")}${inp("username","Usuario")}${inp("pin","PIN")}${sel("role","Rol",[["admin","Admin"],["responsable","Responsable"],["colaborador","Colaborador"],["consulta","Consulta"]])}<button class=btn>Guardar</button></form>`)}function mProject(){modal("Nuevo proyecto",`<form class=grid onsubmit="addProject(event)">${sel("client_id","Cliente",S.clients.map(x=>[x.id,x.name]))}${inp("name","Nombre")}${inp("description","Descripción")}${inp("start_date","Fecha inicio","date")}${inp("due_date","Fecha término","date")}<button class=btn>Guardar</button></form>`)}function mTask(){modal("Nueva tarea",`<form class=grid onsubmit="addTask(event)">${sel("client_id","Cliente",S.clients.map(x=>[x.id,x.name]))}${sel("project_id","Proyecto",S.projects.map(p=>[p.id,p.name+" · "+cn(p.client_id)]))}${inp("title","Tarea")}${inp("description","Descripción")}${sel("owner_id","Responsable",S.users.map(u=>[u.id,u.name]))}${sel("priority","Prioridad",[["critica","Crítica"],["alta","Alta"],["media","Media"],["baja","Baja"]])}${sel("status","Estatus",[["pendiente","Pendiente"],["en_proceso","En proceso"],["en_revision","En revisión"],["terminada","Terminada"]])}${inp("start_date","Fecha inicio","date",today())}${inp("due_date","Fecha término","date")}<button class=btn>Guardar</button></form>`)}async function addClient(e){e.preventDefault();let f=new FormData(e.target);await sb.from("clients").insert({name:f.get("name"),description:f.get("description")});closeM();await load();app()}async function addUser(e){e.preventDefault();let f=new FormData(e.target);await sb.from("users").insert({name:f.get("name"),username:f.get("username"),pin:f.get("pin"),role:f.get("role"),active:true});closeM();await load();app()}async function addProject(e){e.preventDefault();let f=new FormData(e.target);await sb.from("projects").insert({client_id:f.get("client_id"),name:f.get("name"),description:f.get("description"),status:"activo",start_date:f.get("start_date")||null,due_date:f.get("due_date")||null});closeM();await load();app()}async function addTask(e){e.preventDefault();let f=new FormData(e.target);await sb.from("tasks").insert({client_id:f.get("client_id"),project_id:f.get("project_id"),title:f.get("title"),description:f.get("description"),owner_id:f.get("owner_id"),priority:f.get("priority"),status:f.get("status"),start_date:f.get("start_date")||null,due_date:f.get("due_date")||null});closeM();await load();app()}async function upT(id,status){await sb.from("tasks").update({status}).eq("id",id);await load();app()}async function del(tab,id){if(confirm("¿Borrar registro?")){await sb.from(tab).delete().eq("id",id);await load();app()}}function openT(id){let t=S.tasks.find(x=>x.id===id);if(!t)return;let subs=S.subtasks.filter(x=>x.task_id===id).map(x=>`<div class=card style="padding:14px;margin-bottom:10px;box-shadow:none"><b>${esc(x.title)}</b><div class=small>${esc(un(x.owner_id))} · ${esc(x.status)} · ${x.due_date||"sin fecha"}</div></div>`).join("");let comm=S.comments.filter(x=>x.task_id===id).map(x=>`<div class=card style="padding:14px;margin-bottom:10px;box-shadow:none"><b>${esc(un(x.user_id))}</b><p>${esc(x.comment)}</p></div>`).join("");let fs=S.files.filter(x=>x.task_id===id).map(x=>`<div class=card style="padding:14px;margin-bottom:10px;box-shadow:none"><b>${esc(x.file_name)}</b><div class=small>v${x.version} · ${esc(x.file_type||"")}</div><a href="${esc(x.file_url)}" target=_blank>Abrir archivo</a></div>`).join("");modal("Detalle de tarea",`<div class=small>${esc(cn(t.client_id))} · ${esc(pn(t.project_id))}</div><h2>${esc(t.title)}</h2><p>${esc(t.description||"Sin descripción")}</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0"><button class=btn onclick="mSub('${id}')">Agregar subtarea</button><button class=btn2 onclick="mCom('${id}')">Comentar</button><button class=btn2 onclick="mFile('${id}')">Agregar entregable</button></div><h3>Subtareas</h3>${subs||"<p>Sin subtareas.</p>"}<h3>Comentarios</h3>${comm||"<p>Sin comentarios.</p>"}<h3>Archivos / entregables</h3>${fs||"<p>Sin entregables.</p>"}`)}function mSub(id){closeM();modal("Nueva subtarea",`<form class=grid onsubmit="addSub(event,'${id}')">${inp("title","Subtarea")}${sel("owner_id","Responsable",S.users.map(u=>[u.id,u.name]))}${sel("status","Estatus",[["pendiente","Pendiente"],["en_proceso","En proceso"],["en_revision","En revisión"],["terminada","Terminada"]])}${inp("due_date","Fecha término","date")}<button class=btn>Guardar</button></form>`)}async function addSub(e,id){e.preventDefault();let f=new FormData(e.target);await sb.from("subtasks").insert({task_id:id,title:f.get("title"),owner_id:f.get("owner_id"),status:f.get("status"),due_date:f.get("due_date")||null});closeM();await load();openT(id)}function mCom(id){closeM();modal("Nuevo comentario",`<form class=grid onsubmit="addCom(event,'${id}')"><textarea class=input name=comment rows=5></textarea><button class=btn>Guardar</button></form>`)}async function addCom(e,id){e.preventDefault();let f=new FormData(e.target);await sb.from("comments").insert({task_id:id,user_id:S.me.id,comment:f.get("comment")});closeM();await load();openT(id)}function mFile(id){closeM();modal("Nuevo entregable",`<form class=grid onsubmit="addFile(event,'${id}')">${inp("file_name","Nombre del archivo")}${inp("file_url","Link")}${inp("file_type","Tipo")}${inp("version","Versión","number","1")}<button class=btn>Guardar</button></form>`)}async function addFile(e,id){e.preventDefault();let f=new FormData(e.target);await sb.from("files").insert({task_id:id,user_id:S.me.id,file_name:f.get("file_name"),file_url:f.get("file_url"),file_type:f.get("file_type"),version:Number(f.get("version")||1)});closeM();await load();openT(id)}boot();
</script></body></html>
