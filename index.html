<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SM OS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f5f1ea, #f3f4f6);
      color: #1f2937;
    }

    .page {
      min-height: 100vh;
      padding: 28px;
    }

    .center {
      display: grid;
      place-items: center;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(17, 24, 39, 0.08);
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      padding: 34px;
    }

    .small {
      font-size: 12px;
      font-weight: 800;
      color: #6b7280;
      letter-spacing: .04em;
    }

    h1 {
      margin: 6px 0;
      font-size: 44px;
    }

    h2 {
      margin: 0 0 16px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 13px;
      font-weight: 800;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 15px;
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font-family: Arial, Helvetica, sans-serif;
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 12px 18px;
      background: #111827;
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-secondary {
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 12px 18px;
      background: #ffffff;
      color: #111827;
      font-weight: 800;
      cursor: pointer;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 18px;
    }

    .nav button {
      width: 100%;
      display: block;
      margin-bottom: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #ffffff;
      padding: 12px;
      text-align: left;
      font-weight: 800;
      cursor: pointer;
    }

    .nav button.active {
      background: #111827;
      color: #ffffff;
    }

    .stat-number {
      font-size: 34px;
      font-weight: 900;
      margin-top: 8px;
    }

    .task-card {
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 16px;
      background: #ffffff;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .green {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .yellow {
      background: #fff8e1;
      color: #b7791f;
    }

    .red {
      background: #ffebee;
      color: #c62828;
    }

    .gray {
      background: #f3f4f6;
      color: #374151;
    }

    .error {
      color: #c62828;
      font-weight: 800;
      margin-top: 14px;
    }

    pre {
      white-space: pre-wrap;
      background: #f3f4f6;
      padding: 16px;
      border-radius: 14px;
      overflow: auto;
    }

    @media (max-width: 900px) {
      .layout,
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="app" class="page center">
    <div class="card login-card">
      <div class="small">SM SOLUCIONES</div>
      <h1>SM OS</h1>
      <p>Cargando sistema...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yrgbmzxlvbxzegzvwadf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_h_1R-zkaFZqENNSnlrTECA_QDJUF-Vq';

    const app = document.getElementById('app');

    let db = null;
    let currentUser = null;
    let currentView = 'dashboard';

    let users = [];
    let clients = [];
    let projects = [];
    let tasks = [];

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function (char) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[char];
      });
    }

    function showError(title, detail) {
      app.className = 'page center';
      app.innerHTML = `
        <div class="card login-card" style="max-width:760px;">
          <div class="small">SM SOLUCIONES</div>
          <h1>SM OS</h1>
          <p class="error">${escapeHtml(title)}</p>
          <pre>${escapeHtml(detail || '')}</pre>
        </div>
      `;
    }

    function getClientName(id) {
      const client = clients.find(function (item) {
        return item.id === id;
      });

      return client ? client.name : 'Sin cliente';
    }

    function getUserName(id) {
      const user = users.find(function (item) {
        return item.id === id;
      });

      return user ? user.name : 'Sin responsable';
    }

    function getTraffic(task) {
      if (task.status === 'terminada') return 'green';
      if (!task.due_date) return 'green';

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const dueDate = new Date(task.due_date + 'T00:00:00');
      const diff = Math.ceil((dueDate - today) / 86400000);

      if (diff < 0) return 'gray';
      if (diff <= 1) return 'red';
      if (diff <= 3) return 'yellow';

      return 'green';
    }

    function getTrafficText(color) {
      if (color === 'green') return 'En tiempo';
      if (color === 'yellow') return 'Próxima';
      if (color === 'red') return 'Crítica';
      return 'Vencida';
    }

    async function loadData() {
      const results = await Promise.all([
        db.from('users').select('*').order('created_at', { ascending: true }),
        db.from('clients').select('*').order('created_at', { ascending: true }),
        db.from('projects').select('*').order('created_at', { ascending: true }),
        db.from('tasks').select('*').order('created_at', { ascending: false })
      ]);

      const errorResult = results.find(function (result) {
        return result.error;
      });

      if (errorResult) {
        throw errorResult.error;
      }

      users = results[0].data || [];
      clients = results[1].data || [];
      projects = results[2].data || [];
      tasks = results[3].data || [];
    }

    function renderLogin(message) {
      app.className = 'page center';

      app.innerHTML = `
        <form id="loginForm" class="card login-card">
          <div class="small">SM SOLUCIONES</div>
          <h1 style="font-size:58px;">SM OS</h1>
          <p>Sistema Operativo de Gestión Interna</p>

          <label>Usuario</label>
          <input id="username" value="pako" />

          <label>PIN</label>
          <input id="pin" type="password" value="1234" />

          ${message ? `<p class="error">${escapeHtml(message)}</p>` : ''}

          <br><br>
          <button class="btn" style="width:100%;" type="submit">Entrar</button>

          <p class="small" style="margin-top:18px;">Demo inicial: pako / 1234</p>
        </form>
      `;

      document.getElementById('loginForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const pin = document.getElementById('pin').value.trim();

        const result = await db
          .from('users')
          .select('*')
          .eq('username', username)
          .eq('pin', pin)
          .eq('active', true)
          .maybeSingle();

        if (result.error || !result.data) {
          renderLogin('Usuario o PIN incorrecto.');
          return;
        }

        currentUser = result.data;

        await loadData();
        renderApp();
      });
    }

    function navButton(view, label) {
      return `
        <button class="${currentView === view ? 'active' : ''}" onclick="setView('${view}')">
          ${label}
        </button>
      `;
    }

    window.setView = function (view) {
      currentView = view;
      renderApp();
    };

    function renderApp() {
      app.className = 'page';

      app.innerHTML = `
        <header class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
          <div>
            <div class="small">SM OS</div>
            <h1 style="margin:4px 0 0;">Panel General</h1>
            <p style="color:#6b7280;margin:6px 0 0;">
              ${escapeHtml(currentUser.name)} · ${escapeHtml(currentUser.role)}
            </p>
          </div>
          <button class="btn-secondary" onclick="location.reload()">Salir</button>
        </header>

        <section class="layout">
          <aside class="card nav">
            ${navButton('dashboard', 'Dashboard')}
            ${navButton('clientes', 'Clientes')}
            ${navButton('proyectos', 'Proyectos')}
            ${navButton('tareas', 'Tareas')}
            ${navButton('usuarios', 'Usuarios')}
          </aside>

          <main id="content"></main>
        </section>
      `;

      renderView();
    }

    function stat(label, value) {
      return `
        <div class="card">
          <div class="small">${label}</div>
          <div class="stat-number">${value}</div>
        </div>
      `;
    }

    function renderView() {
      const content = document.getElementById('content');

      if (currentView === 'dashboard') {
        content.innerHTML = `
          <div class="grid grid-3">
            ${stat('Clientes', clients.length)}
            ${stat('Proyectos', projects.length)}
            ${stat('Tareas', tasks.length)}
          </div>

          <br>

          <div class="card">
            <h2>Tareas prioritarias</h2>
            ${renderTaskList(tasks.slice(0, 6))}
          </div>
        `;
      }

      if (currentView === 'clientes') {
        content.innerHTML = `
          <div class="card">
            <h2>Clientes</h2>
            ${clients.map(function (client) {
              return `
                <div class="task-card">
                  <h3>${escapeHtml(client.name)}</h3>
                  <p>${escapeHtml(client.description)}</p>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      if (currentView === 'proyectos') {
        content.innerHTML = `
          <div class="card">
            <h2>Proyectos</h2>
            ${projects.map(function (project) {
              return `
                <div class="task-card">
                  <h3>${escapeHtml(project.name)}</h3>
                  <p>${escapeHtml(getClientName(project.client_id))}</p>
                  <p class="small">${escapeHtml(project.status)} · ${escapeHtml(project.start_date || '-')} → ${escapeHtml(project.due_date || '-')}</p>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      if (currentView === 'tareas') {
        content.innerHTML = `
          <div class="card">
            <h2>
              Tareas
              <button class="btn" onclick="createTask()" style="float:right;">Nueva tarea</button>
            </h2>
            ${renderTaskList(tasks)}
          </div>
        `;
      }

      if (currentView === 'usuarios') {
        content.innerHTML = `
          <div class="card">
            <h2>Usuarios</h2>
            ${users.map(function (user) {
              return `
                <div class="task-card">
                  <h3>${escapeHtml(user.name)}</h3>
                  <p>${escapeHtml(user.username)} · ${escapeHtml(user.role)}</p>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
    }

    function renderTaskList(taskList) {
      if (!taskList.length) {
        return '<p>Sin tareas registradas.</p>';
      }

      return taskList.map(function (task) {
        const traffic = getTraffic(task);

        return `
          <div class="task-card">
            <span class="badge ${traffic}">${getTrafficText(traffic)}</span>
            <h3>${escapeHtml(task.title)}</h3>
            <p>${escapeHtml(getClientName(task.client_id))} · ${escapeHtml(getUserName(task.owner_id))}</p>
            <p class="small">${escapeHtml(task.status)} · vence ${escapeHtml(task.due_date || 'sin fecha')}</p>
          </div>
        `;
      }).join('');
    }

    window.createTask = async function () {
      if (!clients.length || !projects.length || !users.length) {
        alert('Faltan clientes, proyectos o usuarios.');
        return;
      }

      const title = prompt('Nombre de la nueva tarea');

      if (!title) return;

      const client = clients[0];
      const project = projects.find(function (item) {
        return item.client_id === client.id;
      }) || projects[0];

      const owner = users[0];

      const result = await db.from('tasks').insert({
        client_id: client.id,
        project_id: project.id,
        title: title,
        description: '',
        owner_id: owner.id,
        priority: 'media',
        status: 'pendiente',
        start_date: null,
        due_date: null
      });

      if (result.error) {
        alert('Error al crear tarea: ' + result.error.message);
        return;
      }

      await loadData();
      renderApp();
    };

    async function start() {
      try {
        if (!window.supabase) {
          showError('No cargó la librería de Supabase.', 'Revisa conexión o bloqueo del CDN.');
          return;
        }

        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        await loadData();

        renderLogin();
      } catch (error) {
        showError('Error inicial de SM OS.', error.message || JSON.stringify(error));
      }
    }

    start();
  </script>
</body>
</html>
