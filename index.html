<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SM OS · SM Soluciones</title>
<link rel="icon" type="image/png" href="assets/sm-logo.png">
<link rel="apple-touch-icon" href="assets/sm-logo.png">
<meta name="theme-color" content="#0B2547">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
if(!window.supabase){
  document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\\/script>');
}
</script>
<style>
:root {
  --bg:#F2F0EC; --bg2:#EAE8E3; --surface:#FFFFFF;
  --surface2:#F7F5F1; --surface3:#EDEAE4;
  --navy:#0B2547; --cyan:#00AADD;
  --cyan-soft:rgba(0,170,221,0.10);
  --ink:#1A2535; --text:#2E3D52; --muted:#6B7A8D;
  --green:#2A7D4F; --gbg:rgba(42,125,79,0.10);
  --yellow:#A0660A; --ybg:rgba(160,102,10,0.10);
  --red:#B83232; --rbg:rgba(184,50,50,0.10);
  --line:rgba(11,37,71,0.10); --line2:rgba(11,37,71,0.16);
  --shadow:0 4px 20px rgba(11,37,71,0.08);
  --r:12px; --rs:8px; --sidebar:256px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
a{color:var(--cyan);text-decoration:none}
h2{font-size:22px;font-weight:800;color:var(--ink)}
h3{font-size:16px;font-weight:700;color:var(--ink)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:99px}

/* LOGIN */
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#F7F5F0,#EDEAE3);padding:20px}
#app{display:none;min-height:100vh;grid-template-columns:var(--sidebar) 1fr}
body.logged #login{display:none}
body.logged #app{display:grid}
.lcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:40px 36px;box-shadow:var(--shadow)}
.llogo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:28px}
.lbrand{text-align:center}
.lbrand .sm{font-size:22px;font-weight:900;letter-spacing:2px;color:var(--navy)}
.lbrand .sol{font-size:22px;font-weight:300;letter-spacing:5px;color:var(--muted)}
.ltag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:2px}
.lfield{margin-bottom:13px}
.lfield label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.lfield input{width:100%;background:var(--surface2);border:1px solid var(--line2);border-radius:var(--rs);padding:12px 14px;color:var(--ink);font-size:15px;outline:none;transition:border-color .2s}
.lfield input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,170,221,.12)}
.lerr{min-height:18px;font-size:13px;color:var(--red);font-weight:600;margin-bottom:9px;text-align:center}
.lbtn{width:100%;height:50px;background:var(--navy);border:0;border-radius:var(--r);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.lbtn:hover{background:#163460}
.usbtn{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line2);border-radius:var(--rs);padding:11px 14px;background:var(--surface2);cursor:pointer;font-size:14px;font-weight:600;color:var(--text);text-align:left;transition:all .15s;margin-bottom:7px}
.usbtn:hover{border-color:var(--cyan);background:var(--cyan-soft);color:var(--navy)}
.usbtn.sel{border-color:var(--cyan);border-width:2px;background:var(--cyan-soft);color:var(--navy);font-weight:800}
.usav{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.usbtn.sel .usav{background:var(--cyan)}

/* SIDEBAR */
.sidebar{width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--line2);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
.sb-top{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-logo img{width:38px;height:auto}
.sbt .sm2{font-size:14px;font-weight:900;letter-spacing:1.5px;color:var(--navy);display:block}
.sbt .os{font-size:11px;font-weight:400;letter-spacing:3px;color:var(--muted);display:block}
.nav-sec{padding:13px 8px 5px}
.nav-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:0 8px;margin-bottom:4px}
.nbtn{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--muted);border-radius:var(--rs);padding:9px 10px;cursor:pointer;font-size:13px;font-weight:600;text-align:left;transition:all .15s;margin-bottom:1px}
.nbtn:hover{background:var(--surface);color:var(--ink)}
.nbtn.active{background:var(--surface);color:var(--navy);font-weight:700;box-shadow:inset 3px 0 0 var(--cyan)}
.ni{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.sb-foot{margin-top:auto;padding:13px 16px;border-top:1px solid var(--line)}
.upill{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:var(--rs);padding:9px 12px;border:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.uinf .un{font-size:13px;font-weight:700;color:var(--ink)}
.uinf .ur{font-size:11px;color:var(--muted)}
.logoutbtn{margin-left:auto;background:transparent;border:0;cursor:pointer;color:var(--muted);font-size:17px}
.logoutbtn:hover{color:var(--red)}

/* MAIN */
.main{display:flex;flex-direction:column;min-height:100vh;min-width:0;background:var(--bg)}
.topbar{height:64px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--surface);position:sticky;top:0;z-index:10;box-shadow:0 1px 8px rgba(11,37,71,.05);border-top:3px solid var(--navy)}
.tb-l{display:flex;flex-direction:column;gap:1px}
.tb-ey{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.tb-ti{font-size:19px;font-weight:800;color:var(--ink)}
.tb-r{display:flex;align-items:center;gap:8px}
.chip{border:1px solid var(--line2);border-radius:var(--rs);padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);white-space:nowrap}
.topout{background:var(--navy);color:#fff;border-color:var(--navy);cursor:pointer;font-weight:800}
.topout:hover{background:#163460;border-color:#163460}
.content{flex:1;padding:24px 28px 40px;display:grid;gap:16px;align-content:start}

/* BUTTONS */
.btn{border:0;border-radius:var(--rs);padding:9px 15px;background:var(--navy);color:#fff;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;white-space:nowrap}
.btn:hover{background:#163460;transform:translateY(-1px)}
.btns{padding:6px 11px;font-size:12px}
.btnc{background:var(--cyan);color:#fff}
.btnc:hover{background:#0093C0}
.btng{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btng:hover{background:var(--surface2);transform:none}
.btnd{background:var(--rbg);color:var(--red);border:1px solid rgba(184,50,50,.2)}
.btnd:hover{background:rgba(184,50,50,.18);transform:none}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:12px}

/* STATS */
.sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;border-top:3px solid var(--navy);box-shadow:var(--shadow)}
.sc.g{border-top-color:var(--green)}.sc.y{border-top-color:var(--yellow)}.sc.r{border-top-color:var(--red)}
.sl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
.sn{font-size:32px;font-weight:900;color:var(--ink);line-height:1}
.ss{font-size:12px;color:var(--muted);margin-top:4px}

/* BADGE */
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.bg_{background:var(--gbg);color:var(--green)}
.by_{background:var(--ybg);color:var(--yellow)}
.br_{background:var(--rbg);color:var(--red)}
.bb_{background:rgba(11,37,71,.1);color:var(--navy)}
.bc_{background:var(--cyan-soft);color:var(--cyan)}
.bx_{background:var(--surface3);color:var(--muted)}

/* SEMAFORO */
.sem{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dg{background:var(--green)}.dy{background:var(--yellow)}.dr{background:var(--red)}

/* TABLE */
.tw{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:9px 13px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line2);text-align:left}
.tw thead th{position:sticky;top:0;z-index:2;background:var(--surface);box-shadow:0 1px 0 var(--line2)}
.sticky-board{overflow:visible!important}
.sticky-board .tw{overflow:visible}
.sticky-board thead th{position:sticky;top:64px;z-index:8;background:var(--surface);box-shadow:0 2px 0 var(--line2),0 8px 16px rgba(11,37,71,.06)}
td{padding:12px 13px;border-bottom:1px solid var(--line);font-size:13px;color:var(--text);vertical-align:middle}
tr:hover td{background:var(--surface2)}

/* FORM */
.fg{display:grid;gap:13px}
.fr2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.fr3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--surface2);border:1px solid var(--line2);border-radius:var(--rs);padding:10px 13px;color:var(--ink);font-size:14px;outline:none;transition:border-color .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,170,221,.10)}
.fld select option{background:var(--surface)}
.fld textarea{min-height:84px;resize:vertical}
.fa{display:flex;gap:9px;justify-content:flex-end;margin-top:6px;padding-top:13px;border-top:1px solid var(--line)}

/* MODAL */
.mbg{position:fixed;inset:0;z-index:50;background:rgba(11,37,71,.30);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.mbg.open{opacity:1;pointer-events:all}
.mbox{width:100%;max-width:580px;max-height:90vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:0 8px 32px rgba(11,37,71,.10);transform:translateY(12px);transition:transform .2s}
.mbg.open .mbox{transform:translateY(0)}
.mbox.wide{max-width:860px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;border-bottom:1px solid var(--line)}
.mcls{background:transparent;border:0;cursor:pointer;color:var(--muted);font-size:19px;line-height:1}
.mcls:hover{color:var(--red)}
.mbody{padding:22px}
.task-actions-sticky{position:sticky;top:-22px;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:0 8px 20px rgba(11,37,71,.08)}
.task-actions-sticky .task-actions-title{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}
.task-actions-sticky .task-actions-row{display:flex;gap:8px;flex-wrap:wrap}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.kcol{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:340px}
.kch{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--line2)}
.kct{font-size:13px;font-weight:700;color:var(--ink)}
.kcc{background:var(--surface3);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:11px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.kcard:hover{border-color:var(--cyan);transform:translateY(-2px)}
.kct2{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.kmeta{display:flex;align-items:center;justify-content:space-between;gap:5px}
.kdue{font-size:11px;color:var(--muted)}
.kown{font-size:11px;font-weight:700;background:var(--navy);color:#fff;border-radius:999px;padding:2px 8px}

/* GANTT */
.gwrap{overflow-x:auto}
.gtable{min-width:900px;font-size:13px}
.gtable th{font-size:10px;width:80px;text-align:center;padding:6px 3px}
.gbc{position:relative;height:34px}
.gbar{position:absolute;top:5px;height:24px;border-radius:5px;background:linear-gradient(90deg,var(--navy),var(--cyan));display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;min-width:24px}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--red);opacity:.6;pointer-events:none}

/* PIPELINE */
.pipeline{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pstage{min-width:180px;flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.psh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.psn{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:11px;margin-bottom:7px;cursor:pointer;transition:all .15s}
.pcard:hover{border-color:var(--cyan);transform:translateY(-1px)}
.pcn{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:5px}
.pcv{font-size:15px;font-weight:900;color:var(--navy)}
.pcc{font-size:11px;color:var(--muted);margin-top:3px}

/* CALENDAR */
.calh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:5px}
.calh span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:4px 0}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calday{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:7px;min-height:84px}
.caldn{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.calday.today{border-color:var(--cyan)}
.calday.today .caldn{color:var(--cyan);font-weight:900}
.cev{font-size:11px;font-weight:700;border-radius:4px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--cyan-soft);color:var(--cyan);border-left:2px solid var(--cyan)}
.cev.er{background:var(--rbg);color:var(--red);border-left-color:var(--red)}
.cev.ey{background:var(--ybg);color:var(--yellow);border-left-color:var(--yellow)}

/* ALERTS */
.alitem{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:12px;border-left:3px solid var(--yellow);box-shadow:var(--shadow);margin-bottom:8px}
.alitem.ar{border-left-color:var(--red)}
.alicon{font-size:16px;flex-shrink:0;margin-top:1px}
.altit{font-size:13px;font-weight:700;margin-bottom:2px;color:var(--ink)}
.alsub{font-size:12px;color:var(--muted)}

/* PROGRESS */
.pb{height:5px;background:var(--surface3);border-radius:999px;overflow:hidden}
.pf{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--navy),var(--cyan))}

/* SECTION HEAD */
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* DETAIL */
.dg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.di .dl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.di .dv{font-size:14px;font-weight:600;color:var(--ink)}

/* TOAST */
.toast{position:fixed;right:22px;bottom:22px;z-index:100;background:var(--surface);border:1px solid var(--line2);border-left:3px solid var(--navy);border-radius:var(--rs);padding:12px 17px;min-width:240px;box-shadow:0 8px 32px rgba(11,37,71,.10);font-size:14px;font-weight:700;color:var(--ink);opacity:0;pointer-events:none;transform:translateY(8px);transition:all .2s}
.toast.show{opacity:1;transform:translateY(0);pointer-events:all}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;gap:16px;color:var(--muted)}
.spin{width:36px;height:36px;border:3px solid var(--line2);border-top-color:var(--cyan);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* HEALTH */
.hbar{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:var(--rs);padding:10px 14px;font-size:13px;font-weight:600}
.crmgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.crmcell{background:var(--surface2);border:1px solid var(--line);border-radius:var(--rs);padding:10px}
.crmcell .dl{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.crmcell .dv{font-size:13px;font-weight:700;color:var(--ink);line-height:1.35;word-break:break-word}
.crmwarn{border-left:3px solid var(--yellow)}
.crmrisk{border-left:3px solid var(--red)}

/* TABS */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line2);margin-bottom:18px}
.tab{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700;padding:9px 15px;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--navy);border-bottom-color:var(--cyan)}

/* EMPTY */
.empty{text-align:center;padding:42px 24px;color:var(--muted)}
.ei{font-size:30px;margin-bottom:10px}

@media(max-width:900px){#app{grid-template-columns:1fr}.sidebar{display:none}.sg{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.sg{grid-template-columns:1fr}.content{padding:16px 14px}.fr2,.fr3{grid-template-columns:1fr}.dg3,.crmgrid{grid-template-columns:1fr}.topbar{height:auto;align-items:flex-start;gap:10px;padding:14px}.tb-r{flex-wrap:wrap;justify-content:flex-end}.chip{font-size:11px;padding:6px 9px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <div class="llogo">
      <img src="assets/sm-logo.png" alt="SM Soluciones" style="width:130px;height:auto">
      <div class="lbrand">
        <div><span class="sm">SM</span><span class="sol">.SOLUCIONES</span></div>
        <div class="ltag">Inteligencia Comercial</div>
      </div>
    </div>
    <div class="lfield">
      <label>Selecciona tu nombre</label>
      <div id="user-sel"></div>
    </div>
    <div class="lfield" id="pin-wrap" style="display:none">
      <label id="pin-lbl">PIN</label>
      <input id="f-pin" type="password" placeholder="••••" maxlength="8" style="letter-spacing:4px;font-size:20px;text-align:center">
    </div>
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="btn-login" style="display:none">Entrar al sistema</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar">
    <div class="sb-top">
      <div class="sb-logo">
        <img src="assets/sm-logo.png" alt="SM">
        <div class="sbt"><span class="sm2">SM OS</span><span class="os">Soluciones</span></div>
      </div>
    </div>
    <div class="nav-sec">

function restClient(url,key){
  function enc(v){ return encodeURIComponent(v==null?'':v); }
  function builder(tbl){
    var st={tbl:tbl,method:'GET',params:new URLSearchParams(),body:null,headers:{apikey:key,Authorization:'Bearer '+key},single:false,returning:false};
    var api={
      select:function(cols){ st.params.set('select',cols||'*'); st.returning=true; return api; },
      order:function(col,opt){ st.params.set('order',col+'.'+((opt&&opt.ascending===false)?'desc':'asc')); return api; },
      eq:function(col,val){ st.params.set(col,'eq.'+enc(val)); return api; },
      insert:function(data){ st.method='POST'; st.body=data; st.returning=true; return api; },
      update:function(data){ st.method='PATCH'; st.body=data; st.returning=true; return api; },
      delete:function(){ st.method='DELETE'; return api; },
      upsert:function(data,opt){ st.method='POST'; st.body=data; st.returning=true; st.headers.Prefer='resolution=merge-duplicates,return=representation'; if(opt&&opt.onConflict) st.params.set('on_conflict',opt.onConflict); return api; },
      single:function(){ st.single=true; return api; },
      then:function(res,rej){ return api.exec().then(res,rej); },
      catch:function(rej){ return api.exec().catch(rej); },
      exec:async function(){
        var qs=st.params.toString();
        var headers=Object.assign({},st.headers);
        if(st.body!==null) headers['Content-Type']='application/json';
        if(st.returning && !headers.Prefer) headers.Prefer='return=representation';
        if(st.single) headers.Accept='application/vnd.pgrst.object+json';
        var ctrl=new AbortController();
        var timer=setTimeout(function(){ctrl.abort();},12000);
        try{
          var r=await fetch(url+'/rest/v1/'+st.tbl+(qs?'?'+qs:''),{method:st.method,headers:headers,body:st.body!==null?JSON.stringify(st.body):undefined,signal:ctrl.signal});
          clearTimeout(timer);
          var txt=await r.text();
          var data=txt?JSON.parse(txt):null;
          if(!r.ok) return {data:null,error:data||{message:r.statusText}};
          if(st.single && Array.isArray(data)) data=data[0]||null;
          return {data:data,error:null};
        }catch(e){ clearTimeout(timer); return {data:null,error:e}; }
      }
    };
    return api;
  }
  return {from:builder,channel:function(){return {on:function(){return this;},subscribe:function(){return this;}};}};
}

function dateObj(s){

function pd(n){ var d=new Date(); d.setDate(d.getDate()+n); return dateKey(d); }

  }).join('\n').trim();

function daysSince(s){

function getAlerts(){
  var a = [];
  var uid = SES ? SES.userId : '';
  DB.tareas.forEach(function(t){
    if(isGroupHeader(t)) return;
    if(!adm() && t.owner_id!==uid) return;
    if(t.estado==='terminada' || !t.fecha_vencimiento) return;
    var d = dayDiff(t.fecha_vencimiento);
    if(d<0) a.push({cl:'ar',ic:'🚨',ti:'Tarea vencida: '+t.titulo,su:pNm(t.proyecto_id)+' · '+uNm(t.owner_id)});
    else if(d<=1) a.push({cl:'ar',ic:'⚠️',ti:'Vence hoy/mañana: '+t.titulo,su:pNm(t.proyecto_id)+' · '+uNm(t.owner_id)});
    else if(d<=3) a.push({cl:'',ic:'⚠️',ti:'Vence en '+d+'d: '+t.titulo,su:pNm(t.proyecto_id)+' · '+uNm(t.owner_id)});
    if(!nextAction(t)) a.push({cl:'ar',ic:'🎯',ti:'Sin siguiente acción: '+t.titulo,su:pNm(t.proyecto_id)+' · define el próximo paso'});
    var dAct = daysSince(lastActivity(t));
    if(dAct!==null && dAct>=14) a.push({cl:'ar',ic:'⏳',ti:'Sin movimiento '+dAct+'d: '+t.titulo,su:pNm(t.proyecto_id)+' · requiere seguimiento'});
    else if(dAct!==null && dAct>=7) a.push({cl:'',ic:'⏳',ti:'Seguimiento frío '+dAct+'d: '+t.titulo,su:pNm(t.proyecto_id)});
    var fs = followDate(t);
    if(fs){
      var df = dayDiff(fs);
      if(df<0) a.push({cl:'ar',ic:'📌',ti:'Seguimiento vencido: '+t.titulo,su:'Programado para '+fmt(fs)});
      else if(df<=1) a.push({cl:'',ic:'📌',ti:'Seguimiento hoy/mañana: '+t.titulo,su:pNm(t.proyecto_id)});
    }
  });
  if(adm()){
    DB.pagos.forEach(function(pay){
      if(pay.estado==='pagado' || !pay.fecha_vencimiento) return;
      var d = dayDiff(pay.fecha_vencimiento);
      if(d<0) a.push({cl:'ar',ic:'💸',ti:'Pago vencido: '+pay.concepto,su:cNm(pay.cliente_id)+' · $'+Number(pay.monto).toLocaleString()});
      else if(d<=5) a.push({cl:'',ic:'💰',ti:'Pago próximo ('+d+'d): '+pay.concepto,su:cNm(pay.cliente_id)+' · $'+Number(pay.monto).toLocaleString()});
    });
  }
  return a;
}

      sb.from('entregables').select('*').order('created_at'),
      sb.from('pagos').select('*').order('created_at',{ascending:false}),
      sb.from('reuniones').select('*').order('fecha',{ascending:false})
    ]);
    DB.usuarios=u.data||[]; DB.clientes=c.data||[]; DB.proyectos=p.data||[];
    DB.tareas=t.data||[]; DB.subtareas=st.data||[]; DB.comentarios=cm.data||[];
    DB.entregables=en.data||[]; DB.pagos=pa.data||[]; DB.reuniones=re.data||[];
    var pk = await sb.from('prokicks_records').select('*').order('created_at',{ascending:false});
    var pkset = await sb.from('prokicks_settings').select('*');
    DB.prokicks_records = pk.error ? [] : (pk.data||[]);
    DB.prokicks_settings = pkset.error ? [] : (pkset.data||[]);
    if(await normalizeProjectGroups()){
      var [t2,st2] = await Promise.all([
        sb.from('tareas').select('*').order('created_at',{ascending:false}),
        sb.from('subtareas').select('*').order('created_at')
      ]);
      DB.tareas=t2.data||DB.tareas; DB.subtareas=st2.data||DB.subtareas;
    }
    return true;
  } catch(e){ console.error(e); return false; }
}
async function normalizeProjectGroups(){
  if(!DB.tareas.length) return false;
  var changed = false;
  var headers = DB.tareas.filter(function(t){return isGroupHeader(t) && isOfunamProject(taskProject(t));});
  for(var i=0;i<headers.length;i++){
    var h = headers[i], g = groupFromHeader(h);
    var subs = DB.subtareas.filter(function(s){return s.tarea_id===h.id;});
    for(var j=0;j<subs.length;j++){
      var s = subs[j];
      var exists = DB.tareas.some(function(t){
        return t.proyecto_id===h.proyecto_id && !isGroupHeader(t) && String(t.titulo||'').trim().toLowerCase()===String(s.titulo||'').trim().toLowerCase() && taskGroup(t)===g;
      });
      if(exists) continue;
      var data = {
        proyecto_id:h.proyecto_id, owner_id:s.owner_id||h.owner_id, titulo:s.titulo,
        descripcion:buildDesc('',{grupo:g,accion:'Definir siguiente acción'}),
        prioridad:h.prioridad||'media', estado:s.estado||'pendiente',
        fecha_inicio:h.fecha_inicio||today(), fecha_vencimiento:s.fecha_vencimiento||h.fecha_vencimiento||pd(30),
        horas_estimadas:8, horas_reales:0
      };
      if(crmEnabled()){
        data.etapa_crm='por_contactar';
        data.siguiente_accion='Definir siguiente acción';
        data.fecha_proximo_seguimiento=null;
        data.ultima_actividad=new Date().toISOString();
      }
      var r = await sb.from('tareas').insert(data).select().single();
      if(!r.error) changed = true;
    }
  }
  for(var k=0;k<DB.tareas.length;k++){
    var t = DB.tareas[k];
    if(!isOfunamProject(taskProject(t)) || isGroupHeader(t) || descVal(t,'Grupo')) continue;
    var inferred = /—/.test(t.titulo||'') ? 'Embajadas' : '';
    if(!inferred) continue;
    var up = {descripcion:buildDesc(stripDescFields(t.descripcion),{grupo:inferred,email:descVal(t,'Email'),tel:descVal(t,'Telefono')||descVal(t,'Teléfono'),dir:descVal(t,'Direccion')||descVal(t,'Dirección'),gancho:descVal(t,'Gancho'),instrumento:descVal(t,'Instrumento'),accion:nextAction(t),seguimiento:followDate(t),etapa:t.etapa_crm||descVal(t,'Etapa'),probabilidad:t.probabilidad||descVal(t,'Probabilidad'),monto:t.monto_estimado||descVal(t,'Monto estimado')})};
    var ur = await sb.from('tareas').update(up).eq('id',t.id);
    if(!ur.error) changed = true;
  }
  return changed;
}

function projectTasks(pid){
  return DB.tareas.filter(function(t){ return t.proyecto_id===pid && !isGroupHeader(t) && (adm() || t.owner_id===SES.userId || myProjs().some(function(p){return p.id===pid;})); });

function projectStats(p){
  var tasks = projectTasks(p.id);
  var done = tasks.filter(function(t){return t.estado==='terminada';}).length;
  var progress = tasks.length ? Math.round(done/tasks.length*100) : 0;
  var overdue = tasks.filter(function(t){return t.estado!=='terminada'&&t.fecha_vencimiento&&dayDiff(t.fecha_vencimiento)<0;}).length;
  var noNext = tasks.filter(function(t){return crmEnabled() && t.estado!=='terminada' && !nextAction(t);}).length;
  var next = tasks.filter(function(t){return t.estado!=='terminada';}).sort(function(a,b){
    return dayDiff(a.fecha_vencimiento||pd(999))-dayDiff(b.fecha_vencimiento||pd(999));
  })[0];
  return {tasks:tasks,done:done,progress:progress,overdue:overdue,noNext:noNext,next:next};
}

var CAL_OFF = 0; // offset de meses desde hoy
function vCA(){
  var ctx = FPID ? xid(DB.proyectos,FPID) : null;
  var base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth()+CAL_OFF);
  var yr = base.getFullYear(), mo = base.getMonth();
  var now2 = new Date();
  var fd = new Date(yr,mo,1).getDay();
  var dim = new Date(yr,mo+1,0).getDate();
  var dn = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var mn = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var byD = {};
  (ctx ? myTasks().filter(function(t){return t.proyecto_id===ctx.id;}) : myTasks()).forEach(function(t){
    if(!t.fecha_vencimiento) return;
    var d = dateObj(t.fecha_vencimiento);
    if(d.getMonth()===mo&&d.getFullYear()===yr){
      var k = d.getDate(); if(!byD[k]) byD[k]=[];
      byD[k].push({l:t.titulo,c:t.estado==='terminada'?'':'er'});
    }
  });
  if(adm() && !ctx) DB.pagos.forEach(function(pay){
    if(!pay.fecha_vencimiento||pay.estado==='pagado') return;
    var d = dateObj(pay.fecha_vencimiento);
    if(d.getMonth()===mo&&d.getFullYear()===yr){
      var k = d.getDate(); if(!byD[k]) byD[k]=[];
      byD[k].push({l:'💰 '+pay.concepto,c:'ey'});
    }
  });
  DB.reuniones.filter(function(r){return !ctx || r.proyecto_id===ctx.id;}).forEach(function(r){
    if(!r.fecha) return;
    var d = dateObj(String(r.fecha).slice(0,10));
    if(d.getMonth()===mo&&d.getFullYear()===yr){

/* ── LOGIN ── */
function buildSelector(){
  var users = DB.usuarios.filter(function(u){return u.activo;});
  var container = document.getElementById('user-sel');
  if(!container) return;
  container.innerHTML = '';
  users.forEach(function(u){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'usbtn';
    btn.innerHTML = '<div class="usav">'+ini(u.nombre)+'</div>'+esc(u.nombre);
    btn.addEventListener('click', function(){
      SELUID = u.id;
      container.querySelectorAll('.usbtn').forEach(function(b){ b.classList.remove('sel'); });
      btn.classList.add('sel');
      document.getElementById('pin-lbl').textContent = 'PIN de '+u.nombre;
      document.getElementById('pin-wrap').style.display = 'block';
      document.getElementById('btn-login').style.display = 'block';
      document.getElementById('lerr').textContent = '';
      var pi = document.getElementById('f-pin');
      pi.value = '';
      setTimeout(function(){ pi.focus(); }, 80);
    });
    container.appendChild(btn);
  });
}

function doLogin(){
  if(!SELUID){ document.getElementById('lerr').textContent='Selecciona tu nombre.'; return; }
  var pin = document.getElementById('f-pin').value.trim();
  if(!pin){ document.getElementById('lerr').textContent='Ingresa tu PIN.'; return; }
  var found = null;
  for(var i=0;i<DB.usuarios.length;i++){
    var u = DB.usuarios[i];
    if(u.id===SELUID && String(u.pin)===String(pin) && u.activo){ found=u; break; }
  }
  if(!found){
    document.getElementById('lerr').textContent = 'PIN incorrecto.';
    document.getElementById('f-pin').value = '';
    document.getElementById('f-pin').focus();
    return;
  }
  activateSession(found,{view:'dashboard',fpid:'',ptab:'tareas',pktab:'dashboard'});
}

function activateSession(found,state){
  SES = {userId: found.id};
  document.getElementById('lerr').textContent = '';
  document.body.classList.add('logged');
  document.getElementById('sb-av').textContent = ini(found.nombre);
  document.getElementById('sb-n').textContent = found.nombre;
  document.getElementById('sb-r').textContent = found.rol==='admin' ? 'Administrador' : 'Usuario';
  if(found.rol==='admin') document.getElementById('nav-admin').style.display = 'block';
  else document.getElementById('nav-admin').style.display = 'none';
  document.getElementById('tb-live').style.display = 'block';
  buildProjectNav();
  VIEW = state&&state.view || 'dashboard';
  FPID = state&&state.fpid || '';
  PTAB = state&&state.ptab || 'tareas';
  PKTAB = state&&state.pktab || 'dashboard';
  document.querySelectorAll('.nbtn').forEach(function(b){ b.classList.toggle('active', b.dataset.v===VIEW); });
  render();
  saveSession();
}

function restoreSession(){
  var s = storedSession();
  if(!s || !s.userId) return false;
  var found = DB.usuarios.find(function(u){return u.id===s.userId && u.activo;});
  if(!found){ clearSession(); return false; }
  activateSession(found,s);
  return true;
}

document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('f-pin').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
function doLogout(){
  if(!confirm('¿Cerrar sesión?')) return;
  clearSession();
  SES=null; SELUID='';
  document.body.classList.remove('logged');
  document.getElementById('nav-admin').style.display = 'none';
  document.getElementById('tb-live').style.display = 'none';
  buildProjectNav();
  document.getElementById('pin-wrap').style.display = 'none';
  document.getElementById('btn-login').style.display = 'none';
  document.getElementById('f-pin').value = '';
  document.getElementById('lerr').textContent = '';
  document.querySelectorAll('.usbtn').forEach(function(b){ b.classList.remove('sel'); });
}
document.getElementById('btn-out').addEventListener('click', doLogout);
document.getElementById('btn-out-top').addEventListener('click', doLogout);

document.getElementById('btn-reload-app').addEventListener('click', hardReloadApp);

})();

var TABLES = ['proyectos','tareas','subtareas','comentarios','entregables','pagos','clientes','usuarios','reuniones','prokicks_records','prokicks_settings'];
TABLES.forEach(function(tbl){
  sb.channel('rt:'+tbl)
    .on('postgres_changes',{event:'*',schema:'public',table:tbl},function(){
      if(SES) refresh();
    })
    .subscribe();
});
</script>
