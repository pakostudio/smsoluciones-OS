<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SM OS · SM Soluciones</title>
<style>
/* ─── TOKENS ─────────────────────────────────────────────── */
:root{
  --cyan:#00AADD;
  --blue:#0B2547;
  --dark:#F2F0EC;
  --surface:#FFFFFF;
  --surface2:#F7F5F1;
  --surface3:#EDEAE4;
  --line:rgba(11,37,71,0.10);
  --line2:rgba(11,37,71,0.16);
  --text:#2E3D52;
  --muted:#6B7A8D;
  --green:#2A7D4F;
  --yellow:#A0660A;
  --red:#B83232;
  --cyan-glow:rgba(0,170,221,0.10);
  --shadow:0 4px 20px rgba(11,37,71,0.08);
  --r:14px;
  --r-sm:10px;
  --sidebar:260px;
  --green-bg:rgba(42,125,79,0.10);
  --yellow-bg:rgba(160,102,10,0.10);
  --red-bg:rgba(184,50,50,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;background:var(--dark);color:var(--text)}
button,input,select,textarea{font:inherit}
a{color:var(--cyan);text-decoration:none}
h1{font-size:40px;font-weight:900;letter-spacing:-1px}
h2{font-size:24px;font-weight:800}
h3{font-size:17px;font-weight:700}
p{line-height:1.55}

/* ─── SCROLLBAR ───────────────────────────────────────────── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:99px}

/* ─── LAYOUT ──────────────────────────────────────────────── */
#app-login{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#F7F5F0 0%,#EDEAE3 100%);
}
#app-main{
  display:none;
  min-height:100vh;
  grid-template-columns:var(--sidebar) 1fr;
}
body.is-app #app-login{display:none}
body.is-app #app-main{display:grid}

/* ─── LOGIN ───────────────────────────────────────────────── */
.login-wrap{width:100%;max-width:440px;padding:16px}
.login-card{
  background:var(--surface);
  border:1px solid var(--line2);
  border-radius:24px;
  padding:40px;
  box-shadow:var(--shadow),0 0 0 1px rgba(0,191,255,0.06);
}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:36px}
.logo-icon{
  width:72px;height:72px;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 32px rgba(0,191,255,0.35);
}
.logo-icon svg{width:40px;height:40px}
.login-brand{text-align:center}
.login-brand .sm{color:var(--cyan);font-weight:900;font-size:26px;letter-spacing:2px}
.login-brand .sol{color:var(--text);font-weight:300;font-size:26px;letter-spacing:6px;opacity:.7}
.login-tagline{color:var(--muted);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-top:4px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.login-field input{
  width:100%;background:var(--surface2);
  border:1px solid var(--line2);border-radius:var(--r-sm);
  padding:13px 16px;color:var(--text);font-size:15px;outline:none;
  transition:border-color .2s;
}
.login-field input:focus{border-color:rgba(0,191,255,0.5);box-shadow:0 0 0 3px rgba(0,191,255,0.08)}
.login-err{min-height:18px;font-size:13px;color:var(--red);font-weight:600;margin-bottom:12px}
.btn-login{
  width:100%;height:52px;
  background:linear-gradient(135deg,var(--blue),#0D2870);
  border:0;border-radius:var(--r);
  color:#fff;font-size:15px;font-weight:800;cursor:pointer;
  letter-spacing:.04em;
  box-shadow:0 8px 24px rgba(26,58,143,0.5);
  transition:all .2s;
  position:relative;overflow:hidden;
}
.btn-login::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,191,255,0.15),transparent);
  opacity:0;transition:opacity .2s;
}
.btn-login:hover::after{opacity:1}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(26,58,143,0.6)}

/* ─── SIDEBAR ─────────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar);
  background:#EAE8E3;
  border-right:1px solid var(--line2);
  display:flex;flex-direction:column;
  height:100vh;position:sticky;top:0;
  overflow-y:auto;
}
.sidebar-top{
  padding:20px 18px 16px;
  border-bottom:1px solid var(--line);
}
.sidebar-logo{display:flex;align-items:center;gap:10px}
.sidebar-logo .logo-mini{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 16px rgba(0,191,255,0.3);flex-shrink:0;
}
.sidebar-logo .logo-mini svg{width:20px;height:20px}
.sidebar-logo .logo-text .sm2{color:var(--cyan);font-weight:900;font-size:15px;letter-spacing:1px}
.sidebar-logo .logo-text .os{color:var(--muted);font-weight:400;font-size:12px;letter-spacing:3px}
.nav-section{padding:16px 10px 8px}
.nav-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:0 8px;margin-bottom:6px}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:10px;
  border:0;background:transparent;
  color:var(--muted);border-radius:var(--r-sm);
  padding:10px 10px;cursor:pointer;
  font-size:13px;font-weight:600;text-align:left;
  transition:all .15s;margin-bottom:2px;
}
.nav-btn .nav-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--cyan-glow);color:var(--cyan);border-left:2px solid var(--cyan)}
.sidebar-foot{
  margin-top:auto;
  padding:16px 18px;
  border-top:1px solid var(--line);
}
.user-pill{
  display:flex;align-items:center;gap:10px;
  background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px;
}
.avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;flex-shrink:0;
}
.user-info .uname{font-size:13px;font-weight:700}
.user-info .urole{font-size:11px;color:var(--muted)}
.btn-logout{
  margin-left:auto;background:transparent;border:0;cursor:pointer;
  color:var(--muted);font-size:18px;transition:color .2s;
}
.btn-logout:hover{color:var(--red)}

/* ─── MAIN PANEL ──────────────────────────────────────────── */
.main-panel{
  display:flex;flex-direction:column;
  min-height:100vh;min-width:0;
  background:var(--dark);
}
.topbar{
  height:68px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;
  background:rgba(10,15,30,0.85);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:10;
}
.topbar-left{display:flex;flex-direction:column}
.topbar-eyebrow{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.topbar-title{font-size:20px;font-weight:800;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:10px}
.chip{
  border:1px solid var(--line2);border-radius:var(--r-sm);
  padding:7px 14px;font-size:12px;font-weight:700;
  color:var(--muted);background:var(--surface);
}
.content{
  flex:1;padding:28px 32px 40px;
  display:grid;gap:20px;align-content:start;
}

/* ─── BUTTONS ─────────────────────────────────────────────── */
.btn{
  border:0;border-radius:var(--r-sm);padding:10px 16px;
  background:var(--blue);color:#fff;
  font-weight:700;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
  transition:all .15s;white-space:nowrap;
}
.btn:hover{background:#224ab5;transform:translateY(-1px)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:var(--r-sm)}
.btn-cyan{background:linear-gradient(135deg,#0099cc,var(--blue))}
.btn-cyan:hover{background:linear-gradient(135deg,#00BFFF,#1A3A8F)}
.btn-ghost{
  background:transparent;border:1px solid var(--line2);color:var(--muted);
}
.btn-ghost:hover{border-color:var(--line);color:var(--text);transform:none}
.btn-danger{background:#7f1d1d;color:#fca5a5}
.btn-danger:hover{background:#991b1b}

/* ─── CARDS / PANELS ──────────────────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:20px;
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;gap:12px;
}
.card-header h3{font-size:16px;color:var(--text)}
.card-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ─── STATS GRID ──────────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat-card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;
  border-top:3px solid var(--cyan);
  transition:transform .15s;
}
.stat-card:hover{transform:translateY(-2px)}
.stat-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.stat-num{font-size:34px;font-weight:900;color:var(--text);line-height:1}
.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}
.stat-card.green-top{border-top-color:var(--green)}
.stat-card.yellow-top{border-top-color:var(--yellow)}
.stat-card.red-top{border-top-color:var(--red)}

/* ─── BADGE ───────────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;
  border-radius:999px;padding:4px 10px;
  font-size:11px;font-weight:800;white-space:nowrap;
}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-yellow{background:rgba(245,158,11,.15);color:var(--yellow)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}
.badge-blue{background:rgba(26,58,143,.35);color:#93C5FD}
.badge-gray{background:var(--surface3);color:var(--muted)}
.badge-cyan{background:var(--cyan-glow);color:var(--cyan)}

/* ─── SEMÁFORO ────────────────────────────────────────────── */
.semaforo{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot-green{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,.6)}
.dot-yellow{background:var(--yellow);box-shadow:0 0 6px rgba(245,158,11,.6)}
.dot-red{background:var(--red);box-shadow:0 0 6px rgba(239,68,68,.6)}

/* ─── TABLE ───────────────────────────────────────────────── */
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{
  padding:10px 14px;
  font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em;
  border-bottom:1px solid var(--line);text-align:left;
}
td{
  padding:13px 14px;
  border-bottom:1px solid var(--line);
  font-size:13px;color:var(--text);vertical-align:middle;
}
tr:hover td{background:rgba(255,255,255,0.02)}

/* ─── FORM ────────────────────────────────────────────────── */
.form-grid{display:grid;gap:14px}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-row-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.field input,.field select,.field textarea{
  width:100%;background:var(--surface2);
  border:1px solid var(--line2);border-radius:var(--r-sm);
  padding:11px 14px;color:var(--text);font-size:14px;outline:none;
  transition:border-color .2s;
}
.field input:focus,.field select,.field textarea:focus{border-color:rgba(0,191,255,0.4)}
.field select option{background:var(--surface2)}
.field textarea{min-height:90px;resize:vertical}
.field-span2{grid-column:span 2}
.field-span3{grid-column:span 3}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;padding-top:16px;border-top:1px solid var(--line)}

/* ─── MODAL ───────────────────────────────────────────────── */
.modal-bg{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{
  width:100%;max-width:600px;max-height:90vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line2);
  border-radius:20px;box-shadow:var(--shadow);
  transform:translateY(16px);transition:transform .2s;
}
.modal-bg.open .modal{transform:translateY(0)}
.modal.modal-wide{max-width:900px}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--line);
}
.modal-head h3{font-size:17px}
.modal-close{
  background:transparent;border:0;cursor:pointer;
  color:var(--muted);font-size:20px;transition:color .2s;line-height:1;
}
.modal-close:hover{color:var(--red)}
.modal-body{padding:24px}

/* ─── KANBAN ──────────────────────────────────────────────── */
.kanban{
  display:grid;
  grid-template-columns:repeat(4,minmax(220px,1fr));
  gap:14px;overflow-x:auto;padding-bottom:6px;
}
.k-col{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;min-height:360px;
}
.k-col-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);
}
.k-col-title{font-size:13px;font-weight:700;color:var(--text)}
.k-count{
  background:var(--surface3);border-radius:999px;
  padding:2px 8px;font-size:11px;font-weight:800;color:var(--muted);
}
.k-card{
  background:var(--surface2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px;margin-bottom:10px;cursor:pointer;
  transition:all .15s;
}
.k-card:hover{border-color:rgba(0,191,255,0.3);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.3)}
.k-card-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text)}
.k-card-meta{display:flex;align-items:center;justify-content:space-between;gap:6px}
.k-card-due{font-size:11px;color:var(--muted)}
.k-card-owner{
  font-size:11px;font-weight:700;
  background:var(--surface3);border-radius:999px;padding:3px 8px;color:var(--muted);
}

/* ─── GANTT ───────────────────────────────────────────────── */
.gantt-wrap{overflow-x:auto}
.gantt-table{min-width:900px;font-size:13px}
.gantt-table th{font-size:10px;width:80px;text-align:center;padding:6px 4px}
.gantt-bar-cell{position:relative;height:36px}
.gantt-bar{
  position:absolute;top:6px;
  height:24px;border-radius:6px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  display:flex;align-items:center;padding:0 8px;
  font-size:11px;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;
  min-width:30px;
}

/* ─── PIPELINE ────────────────────────────────────────────── */
.pipeline{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.pipe-stage{
  min-width:200px;flex:1;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;
}
.pipe-stage-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);
}
.pipe-stage-name{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pipe-card{
  background:var(--surface2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px;margin-bottom:8px;
  cursor:pointer;transition:all .15s;
}
.pipe-card:hover{border-color:rgba(0,191,255,0.3)}
.pipe-card-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
.pipe-card-value{font-size:16px;font-weight:900;color:var(--cyan)}
.pipe-card-client{font-size:11px;color:var(--muted);margin-top:4px}

/* ─── CALENDAR ────────────────────────────────────────────── */
.cal-grid{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  gap:8px;
}
.cal-header{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  gap:8px;margin-bottom:8px;
}
.cal-header span{
  text-align:center;font-size:11px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 0;
}
.cal-day{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:8px;min-height:90px;
}
.cal-day-num{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
.cal-day.today .cal-day-num{color:var(--cyan)}
.cal-day.today{border-color:rgba(0,191,255,0.3)}
.cal-event{
  font-size:11px;font-weight:700;
  background:var(--cyan-glow);color:var(--cyan);
  border-radius:6px;padding:3px 6px;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cal-event.ev-red{background:rgba(239,68,68,.15);color:var(--red)}
.cal-event.ev-yellow{background:rgba(245,158,11,.15);color:var(--yellow)}

/* ─── ALERTS ──────────────────────────────────────────────── */
.alert-item{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--surface2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:14px;
  border-left:3px solid var(--yellow);
}
.alert-item.alert-red{border-left-color:var(--red)}
.alert-item.alert-green{border-left-color:var(--green)}
.alert-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.alert-body .alert-title{font-size:13px;font-weight:700;margin-bottom:3px}
.alert-body .alert-sub{font-size:12px;color:var(--muted)}

/* ─── TABS ────────────────────────────────────────────────── */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{
  border:0;background:transparent;
  color:var(--muted);font-size:13px;font-weight:700;
  padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;
  transition:all .15s;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}

/* ─── PROGRESS ────────────────────────────────────────────── */
.progress-bar{
  height:6px;background:var(--surface3);border-radius:999px;overflow:hidden;margin-top:6px;
}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--cyan))}

/* ─── TOAST ───────────────────────────────────────────────── */
.toast{
  position:fixed;right:24px;bottom:24px;z-index:100;
  background:var(--surface);border:1px solid var(--line2);
  border-left:3px solid var(--cyan);border-radius:var(--r-sm);
  padding:14px 18px;min-width:260px;
  box-shadow:var(--shadow);
  font-size:14px;font-weight:700;color:var(--text);
  opacity:0;pointer-events:none;
  transform:translateY(10px);transition:all .2s;
}
.toast.show{opacity:1;transform:translateY(0);pointer-events:all}

/* ─── EMPTY STATE ─────────────────────────────────────────── */
.empty{
  text-align:center;padding:48px 24px;color:var(--muted);
}
.empty-icon{font-size:36px;margin-bottom:12px}
.empty p{font-size:14px}

/* ─── SECTION HEADING ─────────────────────────────────────── */
.section-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.section-head h2{font-size:20px}

/* ─── DETAIL GRID ─────────────────────────────────────────── */
.detail-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;
}
.detail-item .d-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.detail-item .d-value{font-size:14px;font-weight:600;color:var(--text)}

/* ─── TIMELINE ────────────────────────────────────────────── */
.timeline{display:grid;gap:0}
.tl-item{display:flex;gap:14px;padding-bottom:18px;position:relative}
.tl-item::before{
  content:'';position:absolute;left:14px;top:30px;bottom:0;
  width:1px;background:var(--line);
}
.tl-item:last-child::before{display:none}
.tl-dot{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  background:var(--surface3);border:2px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;margin-top:2px;
}
.tl-body .tl-title{font-size:13px;font-weight:700;margin-bottom:3px}
.tl-body .tl-sub{font-size:12px;color:var(--muted)}

/* ─── RESPONSIVE ──────────────────────────────────────────── */
@media(max-width:900px){
  #app-main{grid-template-columns:1fr}
  .sidebar{display:none}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr}
  .content{padding:18px 16px}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
}

.user-sel-btn:hover{border-color:var(--cyan);background:var(--cyan-glow);color:var(--cyan)}

.usel-av{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.user-sel-btn.selected .usel-av{background:var(--cyan);color:#fff}

function loadState(){
  try{
    const s = localStorage.getItem(STORE_KEY);
    if(s) return JSON.parse(s);
  }catch(e){}
  return defaultState();
}

function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

let state = loadState();
let session = null; // {userId}
let currentView = 'dashboard';
let selectedProjectId = null;
let modalWide = false;

/* ── UTILS ── */
function uid(){ return 'id_'+Math.random().toString(36).slice(2,10) }
function now(){ return new Date().toISOString() }
function today(){ return new Date().toISOString().slice(0,10) }
function plusDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10) }
function fmt(iso){ return iso ? new Date(iso).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}) : '—' }
function fmtDT(iso){ return iso ? new Date(iso).toLocaleString('es-MX') : '—' }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function byId(arr,id){ return arr.find(x=>x.id===id) }
function userName(id){ const u=byId(state.users,id); return u?u.name:'?' }
function clientName(id){ const c=byId(state.clients,id); return c?c.name:'?' }
function projectName(id){ const p=byId(state.projects,id); return p?p.name:'?' }
function initials(name){ return (name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2) }

function semaforo(task){
  if(!task.dueDate) return '<span class="semaforo"><span class="dot dot-green"></span>OK</span>';
  const days = Math.ceil((new Date(task.dueDate)-new Date())/(1000*60*60*24));
  if(task.status==='terminada') return '<span class="semaforo"><span class="dot dot-green"></span>Completa</span>';
  if(days<0) return '<span class="semaforo"><span class="dot dot-red"></span>Vencida</span>';
  if(days<=3) return '<span class="semaforo"><span class="dot dot-yellow"></span>'+days+'d</span>';
  return '<span class="semaforo"><span class="dot dot-green"></span>'+days+'d</span>';
}

function statusBadge(s){
  const m={
    pendiente:'<span class="badge badge-gray">Pendiente</span>',
    en_proceso:'<span class="badge badge-blue">En proceso</span>',
    en_revision:'<span class="badge badge-yellow">En revisión</span>',
    terminada:'<span class="badge badge-green">Terminada</span>',
    activo:'<span class="badge badge-green">Activo</span>',
    pausado:'<span class="badge badge-yellow">Pausado</span>',
    cerrado:'<span class="badge badge-gray">Cerrado</span>',
    pagado:'<span class="badge badge-green">Pagado</span>',
    vencido:'<span class="badge badge-red">Vencido</span>',
  };
  return m[s]||`<span class="badge badge-gray">${esc(s)}</span>`;
}

function priorityBadge(p){
  const m={
    baja:'<span class="badge badge-gray">Baja</span>',
    media:'<span class="badge badge-blue">Media</span>',
    alta:'<span class="badge badge-yellow">Alta</span>',
    critica:'<span class="badge badge-red">Crítica</span>',
  };
  return m[p]||`<span class="badge badge-gray">${esc(p)}</span>`;
}

function pipelineBadge(p){
  const m={
    prospecto:'<span class="badge badge-gray">Prospecto</span>',
    propuesta:'<span class="badge badge-yellow">Propuesta</span>',
    negociacion:'<span class="badge badge-blue">Negociación</span>',
    ejecucion:'<span class="badge badge-cyan">Ejecución</span>',
    cerrado_ganado:'<span class="badge badge-green">Ganado</span>',
    cerrado_perdido:'<span class="badge badge-red">Perdido</span>',
  };
  return m[p]||`<span class="badge badge-gray">${esc(p)}</span>`;
}

function currentUser(){ return session ? byId(state.users,session.userId) : null }
function isAdmin(){ const u=currentUser(); return u && u.role==='admin' }

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2800);
}

/* ── ALERTS ── */
function getAlerts(){
  const alerts=[];
  state.tasks.forEach(t=>{
    if(t.status==='terminada') return;
    if(!t.dueDate) return;
    const days=Math.ceil((new Date(t.dueDate)-new Date())/(1000*60*60*24));
    if(days<0) alerts.push({type:'red',icon:'🚨',title:`Tarea vencida: ${t.title}`,sub:`Proyecto: ${projectName(t.projectId)} · Resp: ${userName(t.ownerId)}`});
    else if(days<=3) alerts.push({type:'yellow',icon:'⚠️',title:`Tarea vence en ${days}d: ${t.title}`,sub:`Proyecto: ${projectName(t.projectId)} · Resp: ${userName(t.ownerId)}`});
  });
  state.payments.forEach(pay=>{
    if(pay.status==='pagado') return;
    const days=Math.ceil((new Date(pay.dueDate)-new Date())/(1000*60*60*24));
    if(days<0) alerts.push({type:'red',icon:'💸',title:`Pago vencido: ${pay.concept}`,sub:`Cliente: ${clientName(pay.clientId)} · $${Number(pay.amount).toLocaleString()}`});
    else if(days<=5) alerts.push({type:'yellow',icon:'💰',title:`Pago próximo (${days}d): ${pay.concept}`,sub:`Cliente: ${clientName(pay.clientId)} · $${Number(pay.amount).toLocaleString()}`});
  });
  return alerts;
}

/* ── MODAL ── */
function openModal(title, bodyHtml, wide=false){
  const bg=document.getElementById('modal-bg');
  const box=document.getElementById('modal-box');
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=bodyHtml;
  box.className='modal'+(wide?' modal-wide':'');
  bg.classList.add('open');
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('open') }
document.getElementById('modal-close').onclick=closeModal;
document.getElementById('modal-bg').addEventListener('click',e=>{ if(e.target.id==='modal-bg') closeModal() });

function formData(formId){
  const f=document.getElementById(formId);
  const d={};
  new FormData(f).forEach((v,k)=>d[k]=v);
  // also non-name inputs
  f.querySelectorAll('[id]').forEach(el=>{
    if(el.tagName!=='BUTTON') d[el.id.replace(formId+'_','')]=el.value;
  });
  return d;
}

function fld(id,label,type='text',val='',extra=''){
  return `<div class="field"><label>${esc(label)}</label><input type="${type}" id="f_${id}" value="${esc(val)}" ${extra}></div>`;
}
function fldTA(id,label,val=''){
  return `<div class="field"><label>${esc(label)}</label><textarea id="f_${id}">${esc(val)}</textarea></div>`;
}
function fldSel(id,label,opts,sel=''){
  const ops=opts.map(([v,t])=>`<option value="${esc(v)}" ${v==sel?'selected':''}>${esc(t)}</option>`).join('');
  return `<div class="field"><label>${esc(label)}</label><select id="f_${id}">${ops}</select></div>`;
}
function fGet(id){ const el=document.getElementById('f_'+id); return el?el.value:'' }

/* ── RENDER ── */
function render(){
  const vp=document.getElementById('view-content');
  const views={
    dashboard:renderDashboard,
    alertas:renderAlertas,
    proyectos:renderProyectos,
    tareas:renderTareas,
    kanban:renderKanban,
    gantt:renderGantt,
    calendario:renderCalendario,
    pipeline:renderPipeline,
    clientes:renderClientes,
    usuarios:renderUsuarios,
    reportes:renderReportes,
  };
  const fn=views[currentView]||renderDashboard;
  vp.innerHTML=fn();
  updateTopbar();
  updateAlertBadge();
}

function updateTopbar(){
  const names={
    dashboard:'Dashboard',alertas:'Alertas',
    proyectos:'Proyectos',tareas:'Mis Tareas',
    kanban:'Kanban',gantt:'Gantt',calendario:'Calendario',pipeline:'Pipeline',
    clientes:'Clientes',usuarios:'Usuarios',reportes:'Reportes',
  };
  const areas={
    dashboard:'Vista Ejecutiva',alertas:'Notificaciones',
    proyectos:'Gestión de Proyectos',tareas:'Seguimiento',
    kanban:'Tablero Visual',gantt:'Cronograma',calendario:'Agenda',pipeline:'CRM',
    clientes:'Administración',usuarios:'Administración',reportes:'Análisis',
  };
  document.getElementById('tb-eyebrow').textContent=areas[currentView]||'SM OS';
  document.getElementById('tb-title').textContent=names[currentView]||'—';
  document.getElementById('tb-date').textContent=new Date().toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
  const u=currentUser();
  document.getElementById('tb-user-chip').textContent=u?u.name:'—';
}

function updateAlertBadge(){
  const count=getAlerts().length;
  const badge=document.getElementById('alert-badge');
  if(count>0){badge.textContent=count;badge.style.display='block';}
  else{badge.style.display='none';}
}

/* ── DASHBOARD ── */
function renderDashboard(){
  const tasks=state.tasks;
  const totalProj=state.projects.filter(p=>p.status!=='cerrado').length;
  const totalTasks=tasks.length;
  const done=tasks.filter(t=>t.status==='terminada').length;
  const overdue=tasks.filter(t=>t.status!=='terminada'&&t.dueDate&&new Date(t.dueDate)<new Date()).length;
  const pct=totalTasks?Math.round(done/totalTasks*100):0;

  const recentTasks=tasks.slice(-5).reverse();
  const alerts=getAlerts().slice(0,3);

  return `
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Proyectos activos</div>
      <div class="stat-num">${totalProj}</div>
      <div class="stat-sub">${state.clients.length} clientes</div>
    </div>
    <div class="stat-card green-top">
      <div class="stat-label">Tareas completadas</div>
      <div class="stat-num">${done}</div>
      <div class="stat-sub">${pct}% del total</div>
    </div>
    <div class="stat-card yellow-top">
      <div class="stat-label">En proceso</div>
      <div class="stat-num">${tasks.filter(t=>t.status==='en_proceso').length}</div>
      <div class="stat-sub">activas ahora</div>
    </div>
    <div class="stat-card red-top">
      <div class="stat-label">Vencidas</div>
      <div class="stat-num">${overdue}</div>
      <div class="stat-sub">requieren atención</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
    <div class="card">
      <div class="card-header"><h3>Avance por proyecto</h3></div>
      ${state.projects.map(p=>{
        const pt=state.tasks.filter(t=>t.projectId===p.id);
        const pd=pt.filter(t=>t.status==='terminada').length;
        const pct2=pt.length?Math.round(pd/pt.length*100):0;
        return `<div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:13px;font-weight:700">${esc(p.name)}</span>
            <span style="font-size:12px;color:var(--muted)">${pct2}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct2}%"></div></div>
          <div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(clientName(p.clientId))} · ${pd}/${pt.length} tareas</div>
        </div>`;
      }).join('')||'<div class="empty"><div class="empty-icon">📁</div><p>Sin proyectos</p></div>'}
    </div>

    <div class="card">
      <div class="card-header"><h3>🔔 Alertas recientes</h3></div>
      ${alerts.length?alerts.map(a=>`
        <div class="alert-item alert-${a.type}" style="margin-bottom:10px">
          <div class="alert-icon">${a.icon}</div>

/* ── GANTT ── */
function renderGantt(){
  const projects = isAdmin() ? state.projects : state.projects.filter(p=>
    state.tasks.some(t=>t.projectId===p.id && t.ownerId===session.userId)
  );
  const start=new Date('2025-01-01');
  const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const msPerDay=1000*60*60*24;
  const totalDays=365;

  return `
  <div class="section-head" style="margin-bottom:18px"><h2>Gantt — 2025</h2></div>
  <div class="card">
    <div class="gantt-wrap">
      <table class="gantt-table" style="width:100%">
        <thead>
          <tr>
            <th style="text-align:left;min-width:220px;padding:8px 14px">Tarea</th>
            <th style="min-width:100px;text-align:left;padding:8px 14px;color:var(--muted);font-size:11px">Proyecto</th>
            ${months.map(m=>`<th>${m}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${projects.flatMap(p=>{
            const ptasks=state.tasks.filter(t=>t.projectId===p.id);
            return ptasks.map((t,i)=>{
              const s=t.startDate?new Date(t.startDate):new Date();
              const e=t.dueDate?new Date(t.dueDate):new Date();
              const startOff=Math.max(0,Math.round((s-start)/msPerDay));
              const dur=Math.max(1,Math.round((e-s)/msPerDay));
              const pctW=(dur/totalDays*100).toFixed(1);
              const pctL=(startOff/totalDays*100).toFixed(1);
              return `<tr>
                <td style="font-size:13px;font-weight:700;white-space:nowrap">${esc(t.title)}</td>
                <td style="font-size:11px;color:var(--muted)">${esc(p.name)}</td>
                <td colspan="12" class="gantt-bar-cell">
                  <div class="gantt-bar" style="left:${pctL}%;width:${pctW}%;min-width:24px">
                    ${dur>14?esc(t.title):''}
                  </div>
                </td>
              </tr>`;
            });
          }).join('')||'<tr><td colspan="14"><div class="empty"><p>Sin tareas con fechas</p></div></td></tr>'}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ── CALENDARIO ── */
function renderCalendario(){
  const now2=new Date();
  const year=now2.getFullYear();const month=now2.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const dayNames=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const tasksByDay={};
  state.tasks.forEach(t=>{
    if(!t.dueDate) return;
    const d=new Date(t.dueDate);
    if(d.getMonth()===month && d.getFullYear()===year){
      const k=d.getDate();
      if(!tasksByDay[k]) tasksByDay[k]=[];
      tasksByDay[k].push(t);
    }
  });
  state.payments.forEach(pay=>{
    if(!pay.dueDate) return;
    const d=new Date(pay.dueDate);
    if(d.getMonth()===month && d.getFullYear()===year){
      const k=d.getDate();
      if(!tasksByDay[k]) tasksByDay[k]=[];
      tasksByDay[k].push({...pay,_type:'pago',title:pay.concept});
    }
  });

  let cells=[];
  for(let i=0;i<firstDay;i++) cells.push(null);
  for(let i=1;i<=daysInMonth;i++) cells.push(i);

  return `
  <div class="section-head" style="margin-bottom:18px">
    <h2>Calendario — ${monthNames[month]} ${year}</h2>
  </div>
  <div class="card">
    <div class="cal-header">${dayNames.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">
      ${cells.map(day=>day===null
        ?`<div style="min-height:90px"></div>`
        :`<div class="cal-day ${day===now2.getDate()?'today':''}">
          <div class="cal-day-num">${day}</div>
          ${(tasksByDay[day]||[]).slice(0,3).map(t=>`
            <div class="cal-event ${t._type==='pago'?'ev-yellow':t.status==='terminada'?'':'ev-red'}" title="${esc(t.title||t.concept||'')}">
              ${t._type==='pago'?'💰':''} ${esc((t.title||t.concept||'').slice(0,18))}
            </div>`).join('')}
        </div>`
      ).join('')}
    </div>
  </div>`;
}

    const pay=byId(state.payments,id);if(!pay)return;
    pay.status='pagado';pay.paidDate=today();
    saveState();closeModal();render();toast('Pago marcado como recibido ✓');
  },

  openUserModal(id){
    const u=id?byId(state.users,id):null;
    openModal(u?'Editar usuario':'Nuevo usuario',`
      <div class="form-grid">
        <div class="form-row">
          ${fld('name','Nombre completo','text',u?.name||'')}
          ${fld('username','Usuario (para login)','text',u?.username||'')}
        </div>
        <div class="form-row">
          ${fld('pin','PIN (numérico)','text',u?.pin||'')}
          ${fldSel('role','Rol',[['admin','Administrador'],['user','Usuario']],u?.role||'user')}
        </div>
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-cyan" onclick="SM._saveUser('${id||''}')">Guardar usuario</button>
        </div>
      </div>`);
  },

  _saveUser(id){
    const name=fGet('name'),username=fGet('username'),pin=fGet('pin');
    if(!name||!username||!pin){toast('Todos los campos son requeridos');return;}
    if(!id && state.users.some(u=>u.username===username)){toast('Usuario ya existe');return;}
    const data={name,username,pin,role:fGet('role')};
    if(id){Object.assign(byId(state.users,id),data);}
    else{state.users.push({id:uid(),...data,active:true,createdAt:now()});}
    saveState();closeModal();render();toast(id?'Usuario actualizado':'Usuario creado ✓');
  },

  toggleUser(id){
    const u=byId(state.users,id);if(!u)return;
    u.active=!u.active;saveState();render();
    toast(u.active?'Usuario activado':'Usuario desactivado');
  },

  openTaskEditModal(id){
    const t=byId(state.tasks,id);if(!t)return;
    closeModal();
    openModal('Editar tarea',`
      <div class="form-grid">
        <div class="form-row">
          ${fldSel('projectId','Proyecto',state.projects.map(p=>[p.id,p.name]),t.projectId)}
          ${fldSel('ownerId','Responsable',state.users.map(u=>[u.id,u.name]),t.ownerId)}
        </div>
        ${fld('title','Título','text',t.title)}
        ${fldTA('description','Descripción',t.description||'')}
        <div class="form-row">
          ${fldSel('priority','Prioridad',[['baja','Baja'],['media','Media'],['alta','Alta'],['critica','Crítica']],t.priority)}
          ${fldSel('status','Estado',[['pendiente','Pendiente'],['en_proceso','En proceso'],['en_revision','En revisión'],['terminada','Terminada']],t.status)}
        </div>
        <div class="form-row-3">
          ${fld('startDate','Inicio','date',t.startDate||today())}
          ${fld('dueDate','Vencimiento','date',t.dueDate||plusDays(7))}
          ${fld('hoursEst','Horas Est.','number',t.hoursEst||0)}
        </div>
        ${fld('hoursReal','Horas reales registradas','number',t.hoursReal||0)}
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-cyan" onclick="SM._updateTask('${id}')">Actualizar</button>
        </div>
      </div>`);
  },

  _updateTask(id){
    const t=byId(state.tasks,id);if(!t)return;
    const title=fGet('title');if(!title){toast('Título requerido');return;}
    Object.assign(t,{
      projectId:fGet('projectId'),ownerId:fGet('ownerId'),title,
      description:fGet('description'),priority:fGet('priority'),status:fGet('status'),
      startDate:fGet('startDate'),dueDate:fGet('dueDate'),
      hoursEst:Number(fGet('hoursEst'))||0,hoursReal:Number(fGet('hoursReal'))||0
    });
    saveState();closeModal();render();toast('Tarea actualizada ✓');
  }
};

/* ── NAVIGATION ── */
function navigate(view){
  currentView=view;
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===view);
  });
  render();
  window.scrollTo(0,0);
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>navigate(btn.dataset.view));
});

/* ── AUTH ── */
// ── SELECTOR DE USUARIOS ──────────────────────────────────
var selectedUid = null;

function buildSelector(){
  var users = state.users.filter(function(u){ return u.active; });
  var html = '';
  for(var i=0; i<users.length; i++){
    var u = users[i];
    var av = initials(u.name);
    html += '<button type="button" class="user-sel-btn" data-uid="'+u.id+'">'
          + '<div class="usel-av">'+av+'</div>'
          + esc(u.name)
          + '</button>';
  }
  document.getElementById('user-selector').innerHTML = html;
  // Attach click handlers
  var btns = document.querySelectorAll('.user-sel-btn');
  for(var j=0; j<btns.length; j++){
    btns[j].addEventListener('click', (function(btn, uid, name){
      return function(){
        selectedUid = uid;
        var all = document.querySelectorAll('.user-sel-btn');
        for(var k=0; k<all.length; k++) all[k].classList.remove('selected');
        btn.classList.add('selected');
        document.getElementById('pin-label').textContent = 'PIN de ' + name;
        document.getElementById('pin-section').style.display = 'block';
        document.getElementById('btn-login').style.display = 'block';
        document.getElementById('login-err').textContent = '';
        var pi = document.getElementById('f-pin');
        pi.value = '';
        setTimeout(function(){ pi.focus(); }, 80);
      };
    })(btns[j], users[j].id, users[j].name));
  }
}

function doLogin(){
  if(!selectedUid){
    document.getElementById('login-err').textContent = 'Selecciona tu nombre.';
    return;
  }
  var pin = document.getElementById('f-pin').value.trim();
  if(!pin){
    document.getElementById('login-err').textContent = 'Ingresa tu PIN.';
    return;
  }
  var found = null;
  for(var i=0; i<state.users.length; i++){
    var u = state.users[i];
    if(u.id === selectedUid && String(u.pin) === String(pin) && u.active){
      found = u; break;
    }
  }
  if(!found){
    document.getElementById('login-err').textContent = 'PIN incorrecto.';
    document.getElementById('f-pin').value = '';
    document.getElementById('f-pin').focus();
    return;
  }
  session = {userId: found.id};
  document.getElementById('login-err').textContent = '';
  document.body.classList.add('is-app');
  document.getElementById('sidebar-avatar').textContent = initials(found.name);
  document.getElementById('sidebar-name').textContent = found.name;
  document.getElementById('sidebar-role').textContent = found.role === 'admin' ? 'Administrador' : 'Usuario';
  if(found.role === 'admin') document.getElementById('nav-admin').style.display = 'block';
  navigate('dashboard');
}

document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('f-pin').addEventListener('keydown', function(e){
  if(e.key === 'Enter') doLogin();
});

document.getElementById('btn-logout').addEventListener('click', function(){
  if(!confirm('¿Cerrar sesión?')) return;
  session = null; selectedUid = null;
  document.body.classList.remove('is-app');
  document.getElementById('nav-admin').style.display = 'none';
  document.getElementById('pin-section').style.display = 'none';
  document.getElementById('btn-login').style.display = 'none';
  document.getElementById('f-pin').value = '';
  document.getElementById('login-err').textContent = '';
  var btns = document.querySelectorAll('.user-sel-btn');
  for(var i=0; i<btns.length; i++) btns[i].classList.remove('selected');
});

// Init date
document.getElementById('tb-date').textContent = new Date().toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});

// ── INIT: cargar state y mostrar selector ─────────────────
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('smos_v2'));
    if(s && s.users && s.users.length > 0){
      var hasAdmin = false;
      for(var i=0; i<s.users.length; i++){
        if(s.users[i].username === 'admin'){ hasAdmin = true; break; }
      }
      if(!hasAdmin){
        s.users.unshift({id:'u1',name:'Administrador',username:'admin',pin:'0000',role:'admin',active:true});
      }
      state = s;
      localStorage.setItem('smos_v2', JSON.stringify(state));
    } else {
      state = defaultState();
      localStorage.setItem('smos_v2', JSON.stringify(state));
    }
  } catch(e){
    state = defaultState();
    localStorage.setItem('smos_v2', JSON.stringify(state));
  }
  buildSelector();
})();
</script>
