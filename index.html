<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SM OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f1ea;color:#1f2937}
.wrap{min-height:100vh;padding:24px}.center{display:grid;place-items:center}.card{background:white;border:1px solid #e5e7eb;border-radius:22px;box-shadow:0 18px 45px rgba(17,24,39,.08);padding:24px}
.btn{border:0;border-radius:14px;padding:12px 18px;background:#111827;color:white;font-weight:800;cursor:pointer}.btn2{border:1px solid #d1d5db;border-radius:14px;padding:10px 14px;background:white;font-weight:800;cursor:pointer}
.input{width:100%;border:1px solid #d1d5db;border-radius:14px;padding:13px 14px;font-size:15px}.small{font-size:12px;color:#6b7280;font-weight:800}
.grid{display:grid;gap:16px}.grid3{grid-template-columns:repeat(3,1fr)}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px}
.nav button{display:block;width:100%;margin-bottom:10px;border:1px solid #e5e7eb;border-radius:14px;background:white;padding:12px;text-align:left;font-weight:800;cursor:pointer}.nav .on{background:#111827;color:white}
.badge{border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.green{background:#e8f5e9;color:#2e7d32}.yellow{background:#fff8e1;color:#b7791f}.red{background:#ffebee;color:#c62828}.gray{background:#f3f4f6;color:#374151}
@media(max-width:900px){.layout,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" class="wrap center"><div class="card"><h1>SM OS</h1><p>Cargando...</p></div></div>
<script>
const URL="https://yrgbmzxlvbxzegzvwadf.supabase.co";
const KEY="sb_publishable_h_1R-zkaFZqENNSnlrTECA_QDJUF-Vq";
const app=document.getElementById("app");
let db,me=null,view="dashboard",users=[],clients=[],projects=[],tasks=[];
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]||m))}
function error(msg,detail){app.className="wrap center";app.innerHTML='<div class="card" style="max-width:780px"><h1>SM OS</h1><p style="color:#c62828;font-weight:800">'+esc(msg)+'</p><pre style="white-space:pre-wrap;background:#f3f4f6;padding:16px;border-radius:14px">'+esc(detail||"")+'</pre></div>'}
async function load(){let r=await Promise.all([db.from("users").select("*"),db.from("clients").select("*"),db.from("projects").select("*"),db.from("tasks").select("*")]);let bad=r.find(x=>x.error);if(bad)throw bad.error;users=r[0].data;clients=r[1].data;projects=r[2].data;tasks=r[3].data}
function client(id){return (clients.find(x=>x.id===id)||{}).name||"Sin cliente"} function user(id){return (users.find(x=>x.id===id)||{}).name||"Sin responsable"}
function sem(t){if(t.status==="terminada")return"green";if(!t.due_date)return"green";let d=Math.ceil((new Date(t.due_date+"T00:00:00")-new Date(new Date().toDateString()))/86400000);return d<0?"gray":d<=1?"red":d<=3?"yellow":"green"}
function login(msg){app.className="wrap center";app.innerHTML='<form class="card" style="width:100%;max-width:460px" id="login"><div class="small">SM SOLUCIONES</div><h1 style="font-size:54px;margin:8px 0 4px">SM OS</h1><p>Sistema Operativo de Gestión Interna</p><label>Usuario</label><input class="input" id="u" value="pako"><br><br><label>PIN</label><input class="input" id="p" type="password" value="1234"><br><br>'+(msg?'<p style="color:#c62828;font-weight:800">'+esc(msg)+'</p>':'')+'<button class="btn" style="width:100%">Entrar</button></form>';document.getElementById("login").onsubmit=async e=>{e.preventDefault();let r=await db.from("users").select("*").eq("username",document.getElementById("u").value.trim()).eq("pin",document.getElementById("p").value.trim()).maybeSingle();if(r.error||!r.data){login("Usuario o PIN incorrecto");return}me=r.data;await load();render()}}
function nav(v,n){return '<button class="'+(view===v?'on':'')+'" onclick="view=\''+v+'\';render()">'+n+'</button>'}
function render(){app.className="wrap";app.innerHTML='<header class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div><div class="small">SM OS</div><h1 style="margin:4px 0 0">Panel General</h1><p style="color:#6b7280">'+esc(me.name)+' · '+esc(me.role)+'</p></div><button class="btn2" onclick="location.reload()">Salir</button></header><section class="layout"><aside class="card nav">'+nav("dashboard","Dashboard")+nav("clientes","Clientes")+nav("tareas","Tareas")+nav("usuarios","Usuarios")+'</aside><main id="content"></main></section>';draw()}
function stat(a,b){return '<div class="card"><div class="small">'+a+'</div><div style="font-size:34px;font-weight:900">'+b+'</div></div>'}
function draw(){let c=document.getElementById("content");if(view==="dashboard")c.innerHTML='<div class="grid grid3">'+stat("Clientes",clients.length)+stat("Tareas",tasks.length)+stat("Usuarios",users.length)+'</div><br>'+taskList();if(view==="clientes")c.innerHTML='<div class="card"><h2>Clientes <button class="btn" onclick="addClient()">Nuevo</button></h2>'+clients.map(x=>'<p><b>'+esc(x.name)+'</b><br><span class="small">'+esc(x.description)+'</span></p>').join("")+'</div>';if(view==="usuarios")c.innerHTML='<div class="card"><h2>Usuarios</h2>'+users.map(x=>'<p><b>'+esc(x.name)+'</b> · '+esc(x.username)+' · '+esc(x.role)+'</p>').join("")+'</div>';if(view==="tareas")c.innerHTML='<div class="card"><h2>Tareas <button class="btn" onclick="addTask()">Nueva</button></h2>'+taskList()+'</div>'}
function taskList(){return '<div class="grid">'+tasks.map(t=>'<div class="card" style="box-shadow:none"><span class="badge '+sem(t)+'">'+sem(t)+'</span><h3>'+esc(t.title)+'</h3><p>'+esc(client(t.client_id))+' · '+esc(user(t.owner_id))+' · '+esc(t.status)+' · vence '+esc(t.due_date||"sin fecha")+'</p></div>').join("")+'</div>'}
async function addClient(){let name=prompt("Nombre del cliente"); if(!name)return; await db.from("clients").insert({name,description:""}); await load(); draw()}
async function addTask(){let title=prompt("Nombre de la tarea"); if(!title)return; let c=clients[0],p=projects.find(x=>x.client_id===c.id),u=users[0]; await db.from("tasks").insert({client_id:c.id,project_id:p.id,title,description:"",owner_id:u.id,priority:"media",status:"pendiente",start_date:null,due_date:null}); await load(); draw()}
try{if(!window.supabase)throw new Error("No cargó Supabase CDN");db=window.supabase.createClient(URL,KEY);load().then(()=>login()).catch(e=>error("Supabase no respondió. Revisa schema.sql o API key.",e.message||JSON.stringify(e)))}catch(e){error("Error inicial de SM OS",e.message)}
</script>
</body>
</html>
